<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/package/400.css"><link rel="stylesheet" href="../fonts/package/700.css">
<style>html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#eceff2}svg text{font-family:'Noto Sans TC',sans-serif}</style>
</head><body>
<svg id="stage" width="1280" height="720" viewBox="0 0 1280 720"></svg>
<script src="globe.js"></script>
<script src="cataract.js"></script>
<script src="sfix.js"></script>
<script>
// Sutured scleral fixation sample (video 鞏膜縫合固定 IOL). RIGHT eye (OD), surgeon at 12: 12 o'clock at the bottom, 9 o'clock (temporal) on the right;
// fixation at 2 o'clock (superonasal, lower left) and 8 o'clock (inferotemporal, upper right). Every panel is the same 3D eye (sources and the 示意 list:
// CARD.md 鞏膜縫合固定 IOL). Sections run through 2–8 (right = 2 o'clock), anterior up. "mm" = behind the posterior surgical limbus (PSL).
// Row 1: finding the sulcus from outside (microscope marks and ruler; the 2 o'clock site magnified with needles perpendicular to the sclera at 0.58 / 1 / 2 mm;
//        the 2–8 overview with the magnifier box; measured from the wrong line; 2 mm with the same needle angle).
// Row 2: trocars, flaps, wound; the needle under the flap; straight needle docked into the 27G needle (section + microscope); hooked, cut, tied outside.
// Row 3: IOL fixed and centred (section + microscope); the knot under the closed flap; asymmetric entries tilt the IOL; errors (haptic slipped, knot exposed).
const G = GLOBE, K = CATARACT, X = SFIX, SN = X.SN, esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const cv = document.createElement('canvas').getContext('2d');
const meas = (t, z, b) => { cv.font = `${b ? 700 : 400} ${z}px "Noto Sans TC"`; return cv.measureText(t).width; };
function cam(px, py, k, x0, y0) { return { tf: `translate(${px} ${py}) scale(${k}) translate(${-x0} ${-y0})`, P: p => [px + (p[0] - x0) * k, py + (p[1] - y0) * k] }; }
function lab(zh, en, tx, ty, a, o = {}) {
  const z = o.size || 11, right = o.side === 'R', w = meas(zh, z, o.bold) + (en ? 4 + meas(en, z, false) : 0), col = o.color || '#1f2a36', lc = o.lc || '#5f6d7b';
  const x1 = right ? tx - w - 5 : tx + w + 5, x0 = right ? tx - w : tx;
  const ln = a ? `<line x1="${x1}" y1="${ty - z * 0.36}" x2="${a[0]}" y2="${a[1]}" stroke="#fff" stroke-width="3" opacity="0.75"/><line x1="${x1}" y1="${ty - z * 0.36}" x2="${a[0]}" y2="${a[1]}" stroke="${lc}" stroke-width="1.05"/><circle cx="${a[0]}" cy="${a[1]}" r="2.3" fill="${lc}" stroke="#fff" stroke-width="1"/>` : '';
  return `<g>${ln}<text x="${x0}" y="${ty}" font-size="${z}" stroke="#fff" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round"><tspan fill="${col}" font-weight="${o.bold ? 700 : 500}">${esc(zh)}</tspan>${en ? `<tspan fill="${o.enColor || '#5b6878'}" dx="4">${esc(en)}</tspan>` : ''}</text></g>`;
}
const T = (x, y, s, o = {}) => `<text x="${x}" y="${y}" font-size="${o.size || 12}" fill="${o.color || '#1d2733'}" font-weight="${o.bold ? 700 : 400}" text-anchor="${o.anchor || 'start'}" ${o.halo ? 'stroke="#fff" stroke-width="3.2" paint-order="stroke"' : ''}>${esc(s)}</text>`;
const sbar = (x, y, k, txt = '1 mm') => `<rect x="${x - 6}" y="${y - 20}" width="${k + 12}" height="28" rx="5" fill="#fff" opacity="0.85"/><path d="M${x} ${y}h${k}" stroke="#1d2733" stroke-width="3"/>${T(x + k / 2, y - 7, txt, { size: 11, bold: true, anchor: 'middle' })}`;
const o = [], HEAD = 28;
function panel(id, PX, PY, PW, PH, title, note) {
  o.push(`<rect x="${PX}" y="${PY}" width="${PW}" height="${PH}" rx="9" fill="#fff" stroke="#d3dae1"/>`, `<clipPath id="c${id}"><rect x="${PX + 1}" y="${PY + HEAD}" width="${PW - 2}" height="${PH - HEAD - 1}" rx="7"/></clipPath>`);
  o.push(T(PX + 9, PY + 19, title, { size: 12, bold: true }), T(PX + PW - 8, PY + 19, note || '', { size: 10, color: '#5b6878', anchor: 'end' }));
}
const clipG = (id, tf, svg) => `<g clip-path="url(#c${id})"><g transform="${tf}">${svg}</g></g>`;

// ---------------------------------------------------------------- states (st.sfix; OD, surgeon at 12; fixation 2 and 8 o'clock)
const S = x => ({ sfix: x });
const ANAT = S({ vit: 1, peri: 1, marks: 1 });                                         // A: marks and the ruler on bare sclera
const PINS = S({ vit: 1, peri: 1, pins: [{ h: 2, mm: X.SUL - SN.psl }, { h: 2, mm: 1 }, { h: 2, mm: 2 }] });   // B: perpendicular needles at the 2/8 sulcus, 1 and 2 mm
const OVER = S({ vit: 0.55, old: {} });                                          // C: aphakic, vitrectomy in progress (示意), the old IOL dislocated (示意)
const WRONG = S({ vit: 1, peri: 1, flap: { open: 1 }, ndl: { s2: 1, s8: 1, from: 'vis', pass: 0.14, g27: 0, out: 0 } });   // D: 1 mm from the visible limbus, same needle angle
const TWO = S({ vit: 1, peri: 1, flap: { open: 1 }, ndl: { s2: 2, s8: 2, pass: 0.14, g27: 0, out: 0 } });                  // E: 2 mm (Kokame 2018), same needle angle
const SETUP = S({ vit: 1, peri: 1, marks: 1, flap: { open: 1 }, trocar: 1, inc: 1 });   // F: trocars 7 / 10 / 1, flaps lifted, the 12 o'clock wound
const ENTER = S({ vit: 1, peri: 1, flap: { open: 1 }, ndl: { pass: 0.12, g27: 0, out: 0 } });                             // G: the straight needle entering the bed
const DOCK = S({ vit: 1, peri: 1, flap: { open: 1 }, trocar: 1, inc: 1, ndl: { pass: 1, g27: 1, out: 0 } });              // H, I: docked in the 27G needle
const HOOK = S({ vit: 1, peri: 1, flap: { open: 1 }, trocar: 1, inc: 1, ndl: { hook: 1, cut: 1 }, iol: { at: 'out' } });   // J: hooked out, cut, tied to the haptics
const FIX = S({ vit: 1, peri: 1, flap: { open: 0 }, trocar: 1, inc: 1, ndl: {}, iol: {}, knot: 1 });                       // K, L, M: fixed, knots under the flaps
const ASYM = S({ vit: 1, peri: 1, flap: { open: 0 }, ndl: { s8: 2 }, iol: {}, knot: 1 });                                   // N: 8 o'clock entry at 2 mm → tilt
const ERR = S({ vit: 1, peri: 1, flap: { open: 0 }, trocar: 1, inc: 1, ndl: {}, iol: { slip: 8 }, knot: 1, exposed: 2 });  // O: haptic slipped (8), knot exposed (2)

const OR = K.orient({ eye: 'OD', surgeon: 12 }), OSc = K.orient({ eye: 'OD', view: 'section', h: 2 });
o.push(T(16, 30, '鞏膜縫合固定 IOL 模型樣本：右眼 OD、術者坐 12 點、固定在 2 點與 8 點', { size: 19, bold: true }));
o.push(T(1264, 30, `切面 ${OSc.left}–${OSc.right} 點（右＝2 點）；mm 從角膜緣後界量；示意處見 CARD.md`, { size: 12, color: '#5b6878', anchor: 'end' }));
const COLS = [12, 265, 518, 771, 1024], PW = 244, PH2 = 212, ROWS = [42, 260, 478], CH = PH2 - HEAD;
const secPanel = (id, col, row, st, title, note, k, x0, y0, step = 0.025) => { const PX = COLS[col], PY = ROWS[row], c = cam(PX, PY + HEAD, k, x0, y0);
  const s = X.section({ st, h: 2, win: { x: x0, y: y0, w: (PW - 2) / k, h: CH / k }, step, id }); panel(id, PX, PY, PW, PH2, title, note); o.push(clipG(id, c.tf, s.svg)); return { s, A: s.A, P: c.P, PX, PY, k }; };
const scopePanel = (id, col, row, st, title, note, k = 10.5, cx = 0, cy = 0, extra = '') => { const PX = COLS[col], PY = ROWS[row], x0 = cx - (PW - 2) / k / 2, y0 = cy - CH / k / 2, c = cam(PX, PY + HEAD, k, x0, y0);
  const e = X.enface({ st, id }); panel(id, PX, PY, PW, PH2, title, note); o.push(clipG(id, c.tf, e.svg + extra)); return { e, A: e.A, P: c.P, PX, PY, M: e.M, k }; };
const pl2 = G.planes.meridian(2), P2 = p3 => G.toPlane(pl2, p3);
// ruler ticks on the outer surface in a section: short marks along the outward normal, labelled in mm behind the PSL
const secTicks = (P, list, from = 'psl', len = 0.22, quiet = []) => X.ticks(2, list, from).map(t => { const a = P(P2(t.p)), b = P(P2(G.add(t.p, t.n, len))), q = P(P2(G.add(t.p, t.n, len + 0.12))), col = from === 'vis' ? '#2a8fc7' : '#6a3fb0';
  return `<path d="M${a[0].toFixed(1)} ${a[1].toFixed(1)}L${b[0].toFixed(1)} ${b[1].toFixed(1)}" stroke="${col}" stroke-width="2"/>` + (quiet.includes(t.mm) ? '' : T(q[0], q[1] + 4, String(t.mm), { size: 10, bold: true, color: col, anchor: 'middle', halo: true })); }).join('');   // quiet: no number where the needle enters
const ZW = { x: 5.55, y: -10.55, k: 64 };                                               // the 2 o'clock close-up window (mm, px/mm)

// ================= A: microscope: orientation, the two marks 180° apart, the PSL line and a ruler along 2 o'clock
{ const { A, P, PX, PY, M } = scopePanel('a', 0, 0, ANAT, '術者視角：兩個固定點', '右眼 OD', 9.4, -0.6, 0.9);
  const t1 = `${OR.eyeZh}　術者坐 ${OR.bottom} 點`, t2 = `下＝${OR.bottom} 點　右＝${OR.right} 點 ${OR.rightAnat.horiz}`, tw = Math.max(meas(t1, 10, true), meas(t2, 10, true)) + 24;   // + margin: measured before the web font is in
  o.push(`<rect x="${PX + 6}" y="${PY + HEAD + 4}" width="${tw}" height="30" rx="4" fill="#1d2733" opacity="0.82"/>`, T(PX + 11, PY + HEAD + 16, t1, { size: 10, bold: true, color: '#fff' }), T(PX + 11, PY + HEAD + 29, t2, { size: 10, bold: true, color: '#fff' }));
  for (const t of X.ticks(2, [0, 1, 2])) { const c = M(t.p), d = G.clockDir(2.0), side = M(G.P3(2.08, t.s, 0)), u = [side[0] - c[0], side[1] - c[1]], l = Math.hypot(...u) || 1, a = P([c[0] - u[0] / l * 0.45, c[1] - u[1] / l * 0.45]), b = P([c[0] + u[0] / l * 0.45, c[1] + u[1] / l * 0.45]);
    o.push(`<path d="M${a[0].toFixed(1)} ${a[1].toFixed(1)}L${b[0].toFixed(1)} ${b[1].toFixed(1)}" stroke="#6a3fb0" stroke-width="2"/>`); }
  const anat2 = K.anat('OD', 2), anat8 = K.anat('OD', 8);
  o.push(lab(`2 點 ${anat2.en}`, '', PX + 8, PY + 196, P(A.mark2), { bold: true, color: '#6a3fb0', lc: '#6a3fb0' }));
  o.push(lab(`8 點 ${anat8.en}`, '', PX + PW - 8, PY + 72, P(A.mark8), { side: 'R', bold: true, size: 10, color: '#6a3fb0', lc: '#6a3fb0' }));
  o.push(lab('角膜緣後界', 'PSL', PX + PW - 8, PY + 196, P(M(G.P3(1.2, SN.psl, 0))), { side: 'R', color: '#3c4a57' })); }
// ================= B: the 2 o'clock site magnified: needles perpendicular to the sclera (Duffey's mapping) at the 2/8 sulcus value, 1 and 2 mm
{ const { A, P, PX, PY, k } = secPanel('b', 1, 0, PINS, '垂直進針：落在哪裡', '2 點放大', ZW.k, ZW.x, ZW.y, 0.006);
  o.push(`<g clip-path="url(#cb)">${secTicks(P, [0, 1, 2])}${secTicks(P, [0], 'vis')}</g>`);
  o.push(lab(`${(X.SUL - SN.psl).toFixed(2)} mm：睫狀溝`, 'sulcus', PX + PW - 8, PY + 52, P(A.pinExit0), { side: 'R', bold: true, color: '#1d6b3a', lc: '#1d6b3a' }));
  o.push(lab('1 mm：睫狀突前緣', '', PX + PW - 8, PY + 86, P(A.pinExit1), { side: 'R', color: '#7a3b1e', lc: '#7a3b1e' }));
  o.push(lab('2 mm：pars plicata', '', PX + PW - 8, PY + 120, P(A.pinExit2), { side: 'R', color: '#7a3b1e', lc: '#7a3b1e' }));
  o.push(lab('虹膜根', 'iris root', PX + 8, PY + 196, P(A.root), { color: '#4a2b19', lc: '#4a2b19' }));
  o.push(sbar(PX + PW - 14 - k, PY + 196, k)); }
// ================= C: 2–8 overview: aphakic, no capsule, vitrectomy (core first; 示意), the old IOL dislocated inferiorly (示意); the magnifier box of B
{ const { A, P, PX, PY, k } = secPanel('c', 2, 0, OVER, '無晶體、無囊袋：2–8 點切面', '右＝2 點', 12.8, -9.4, -13.4, 0.04);
  const bx = P([ZW.x, ZW.y]), bw = (PW - 2) / ZW.k * k, bh = CH / ZW.k * k;
  o.push(`<rect x="${bx[0].toFixed(1)}" y="${bx[1].toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="none" stroke="#6a3fb0" stroke-width="1.6" stroke-dasharray="4 2"/>`);
  o.push(lab('放大框（B）', '', PX + PW - 8, PY + 52, [bx[0] + bw / 2, bx[1]], { side: 'R', color: '#6a3fb0', lc: '#6a3fb0' }));
  o.push(lab('舊 IOL 往下脫位', '示意', PX + 8, PY + 196, P(A.old), { color: '#7a6a1e', lc: '#7a6a1e' }));
  o.push(lab('pars plana', '', PX + PW - 8, PY + 196, P(A.plana), { side: 'R', color: '#3c4a57' }));
  o.push(lab('8 點', 'inferotemporal', PX + 8, PY + 52, P(A.rootL), { color: '#3c4a57' }));
  o.push(sbar(PX + 14, PY + 150, k)); }
// ================= D: measured from the wrong line: 1 mm from the clear-cornea edge (visible limbus) with the same needle angle → into the chamber angle
{ const { A, P, PX, PY, k } = secPanel('d', 3, 0, WRONG, '錯：從透明角膜邊緣量 1 mm', '示意', ZW.k, ZW.x, ZW.y, 0.006);
  o.push(`<g clip-path="url(#cd)">${secTicks(P, [0, 1], 'vis', 0.22, [1])}${secTicks(P, [0])}</g>`);
  o.push(lab('進到隅角（虹膜前）', 'angle', PX + 8, PY + 196, P(G.toPlane(pl2, X.passes(X.norm(WRONG)).I2)), { bold: true, color: '#b3262c', lc: '#b3262c' }));
  o.push(lab('visible limbus 0', '', PX + PW - 8, PY + 52, P(A.vis), { side: 'R', color: '#2a8fc7', lc: '#2a8fc7' }));
  o.push(sbar(PX + PW - 14 - k, PY + 196, k)); }
// ================= E: 2 mm (Kokame 2018) with the same needle angle: through the ciliary processes (pars plicata; bleeding risk), farther from the iris
{ const { A, P, PX, PY, k } = secPanel('e', 4, 0, TWO, '對照：2 mm（Kokame 2018）', '同一個角度', ZW.k, ZW.x + 0.3, ZW.y + 0.55, 0.006);
  o.push(`<g clip-path="url(#ce)">${secTicks(P, [0, 1, 2], 'psl', 0.22, [2])}</g>`);
  o.push(lab('穿過睫狀突', 'pars plicata', PX + 8, PY + 196, P(G.toPlane(pl2, X.passes(X.norm(TWO)).I2)), { bold: true, color: '#7a3b1e', lc: '#7a3b1e' }));
  o.push(T(PX + 8, PY + 52, '出血風險；離虹膜較遠', { size: 11, bold: true, color: '#7a3b1e', halo: true }));
  o.push(sbar(PX + PW - 14 - k, PY + 196, k)); }

// ================= F: setup: three 23G trocars 3.5 mm behind the PSL (infusion 7 o'clock), conjunctiva opened, triangular flaps lifted, the 12 o'clock wound
{ const { A, P, PX, PY } = scopePanel('f', 0, 1, SETUP, '23G trocar、三角瓣、12 點切口', '下＝12 點', 8.6, 0, -0.2);
  o.push(lab('infusion 7 點', '', PX + PW - 8, PY + 52, P(A.trocar7), { side: 'R', color: '#2a8fc7', lc: '#2a8fc7', bold: true }));
  o.push(lab('trocar 10 點', '', PX + PW - 8, PY + 196, P(A.trocar10), { side: 'R', color: '#3c4a57' }));
  o.push(lab('三角瓣', 'flap', PX + 8, PY + 160, P(A.bed2), { bold: true, color: '#7a5418', lc: '#7a5418' }));
  o.push(lab('12 點切口', '', PX + 8, PY + 196, P(A.inc), { color: '#3c4a57' })); }
// ================= G: the needle enters the flap bed 1 mm behind the PSL (Guedes 2026), aimed behind the iris through the sulcus
{ const { A, P, PX, PY, k } = secPanel('g', 1, 1, ENTER, '瓣下進針：1 mm', 'Guedes 2026', ZW.k, ZW.x + 0.15, ZW.y - 0.25, 0.006);
  o.push(`<g clip-path="url(#cg)">${secTicks(P, [0, 1], 'psl', 0.22, [1])}</g>`);
  o.push(lab('掀起的瓣', '1/3 厚', PX + 8, PY + 52, P(A.flapTip2), { bold: true, color: '#3c4a57' }));
  o.push(lab('瓣床', 'bed', PX + PW - 8, PY + 52, P(G.toPlane(pl2, X.flapPt(2, 2.0, 0, SN.flap.frac))), { side: 'R', color: '#7a5418', lc: '#7a5418' }));
  o.push(lab('直針', 'straight needle', PX + 8, PY + 196, P(A.ntip), { color: '#3c4a57' }));
  o.push(sbar(PX + PW - 14 - k, PY + 196, k)); }
// ================= H: the 2–8 section: the straight needle from 2 o'clock docks into the 27G needle from 8 o'clock, in the pupil behind the iris
{ const { A, P, PX, PY, k } = secPanel('h', 2, 1, DOCK, '直針接進 27G 針', '右＝2 點', 14.2, -8.5, -11.6, 0.04);
  o.push(lab('會合點', 'dock', PX + 8, PY + 196, P(A.D), { bold: true, color: '#b3262c', lc: '#b3262c' }));
  o.push(lab('27G 接引針', '', PX + 8, PY + 52, P(G.toPlane(pl2, G.add(X.passes(X.norm(DOCK)).E8, [0, 0, 0]))), { color: '#3c4a57' }));
  o.push(lab('直針', '', PX + PW - 8, PY + 52, P(A.E2), { side: 'R', color: '#3c4a57' })); }
{ const { A, P, PX, PY } = scopePanel('i', 3, 1, DOCK, '術者視角：在瞳孔裡會合', '下＝12 點', 9.5, 0, 0);
  o.push(lab('會合點', 'dock', PX + PW - 8, PY + 196, P(A.D), { side: 'R', bold: true, color: '#b3262c', lc: '#b3262c' }));
  o.push(lab('27G', '', PX + PW - 8, PY + 52, P(A.E8), { side: 'R', color: '#3c4a57' }));
  o.push(lab('直針', '', PX + 8, PY + 196, P(A.E2), { color: '#3c4a57' })); }
// ================= J: the strand hooked out of the 12 o'clock wound, cut in two, each end tied to the distal third of a haptic (outside the eye; 示意 pose)
{ const { A, P, PX, PY } = scopePanel('j', 4, 1, HOOK, '勾出、剪斷、綁 haptic', 'Guedes 2026', 7.0, 0, 4.2);
  o.push(lab('綁在 haptic 遠端 1/3', '3-1-1', PX + 8, PY + 196, P(A.tieOut2), { bold: true, color: '#3c4a57' }));
  o.push(lab('12 點切口', '', PX + PW - 8, PY + 52, P(A.inc), { side: 'R', color: '#3c4a57' })); }

// ================= K–L: fixed: both haptics pulled to the sulcus, optic centred, tilt 0; knots in the beds under the closed flaps
{ const { A, P, PX, PY, k } = secPanel('k', 0, 2, FIX, 'IOL 縫好：置中、不傾斜', '右＝2 點', 17.4, -6.95, -13.0, 0.03);
  o.push(lab(`傾斜 ${A.IO.tilt.toFixed(1)}°`, 'tilt', PX + 8, PY + 196, P(A.iolC), { bold: true, color: '#1d6b3a', lc: '#1d6b3a' }));
  o.push(lab('haptic 綁在 sulcus', '', PX + PW - 8, PY + 52, P(A.tie2), { side: 'R', color: '#7a6a1e', lc: '#7a6a1e' })); }
{ const { A, P, PX, PY } = scopePanel('l', 1, 2, FIX, '術者視角：optic 置中', '下＝12 點', 9.5, 0, 0);
  o.push(lab('optic 置中', '', PX + PW - 8, PY + 52, P(A.iolC), { side: 'R', bold: true, color: '#1d6b3a', lc: '#1d6b3a' }));
  o.push(lab('線結在瓣下', '', PX + 8, PY + 196, P(A.knot2), { color: '#3c4a57' })); }
// ================= M: the knot under the closed flap (magnified)
{ const { A, P, PX, PY, k } = secPanel('m', 2, 2, FIX, '線結埋在瓣下', '2 點放大', 110, 6.55, -10.05, 0.004);
  o.push(lab('線結', 'knot', PX + 8, PY + 196, P(A.knot2), { bold: true, color: '#111827', lc: '#111827' }));
  o.push(lab('蓋回的瓣', 'flap', PX + PW - 8, PY + 52, P(G.toPlane(pl2, X.flapPt(2, 1.4, 0, SN.flap.frac / 2))), { side: 'R', color: '#3c4a57' }));
  o.push(sbar(PX + PW - 14 - k / 2, PY + 196, k / 2, '0.5 mm')); }
// ================= N: asymmetric entries (8 o'clock at 2 mm with the same needle angle) → the IOL tilts (Zhao 2025: asymmetry predicts vertical tilt; amount 示意)
