<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/package/400.css"><link rel="stylesheet" href="../fonts/package/700.css">
<style>html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#eceff2}svg text{font-family:'Noto Sans TC',sans-serif}</style>
</head><body>
<svg id="stage" width="1280" height="720" viewBox="0 0 1280 720"></svg>
<script src="globe.js"></script>
<script src="pk.js"></script>
<script>
// Penetrating keratoplasty sample (videos pk-tectonic-descemetocele = case B, pk-failed-dmek = case A). LEFT eye (OS), surgeon at 12: 12 o'clock at the
// bottom, 3 o'clock (OS temporal) on the left. Sections run through 12–6 with 12 o'clock on the LEFT (anterior up) unless the title says otherwise.
// Every panel is the same 3D eye (sources and the 示意 list: CARD.md PK).
// Row 1: case B before surgery (microscope, 12–6 section, the descemetocele magnified); case A before surgery (microscope, 12–6 section).
// Row 2: partial-depth trephination; into the chamber and scissors round; open sky with the diaphragm bulging forward (section, microscope); donor held above.
// Row 3: the four cardinal sutures in order; 16 sutures: depth and the buried knot; BSS reforming the chamber; Seidel leak; case A's LI and PAS (1–7 section).
const G = GLOBE, K = PK, PN = K.PN, esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const cv = document.createElement('canvas').getContext('2d');
const meas = (t, z, b) => { cv.font = `${b ? 700 : 400} ${z}px "Noto Sans TC"`; return cv.measureText(t).width; };
function cam(px, py, k, x0, y0) { return { tf: `translate(${px} ${py}) scale(${k}) translate(${-x0} ${-y0})`, P: p => [px + (p[0] - x0) * k, py + (p[1] - y0) * k] }; }
function lab(zh, en, tx, ty, a, o = {}) {
  const z = o.size || 11, right = o.side === 'R', w = 1.08 * (meas(zh, z, o.bold) + (en ? 4 + meas(en, z, false) : 0)),   // × 1.08: measured before the web font is in
    col = o.color || '#1f2a36', lc = o.lc || '#5f6d7b';
  const x1 = right ? tx - w - 5 : tx + w + 5, x0 = right ? tx - w : tx;
  const ln = a ? `<line x1="${x1}" y1="${ty - z * 0.36}" x2="${a[0]}" y2="${a[1]}" stroke="#fff" stroke-width="3" opacity="0.75"/><line x1="${x1}" y1="${ty - z * 0.36}" x2="${a[0]}" y2="${a[1]}" stroke="${lc}" stroke-width="1.05"/><circle cx="${a[0]}" cy="${a[1]}" r="2.3" fill="${lc}" stroke="#fff" stroke-width="1"/>` : '';
  return `<g>${ln}<text x="${x0}" y="${ty}" font-size="${z}" stroke="#fff" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round"><tspan fill="${col}" font-weight="${o.bold ? 700 : 500}">${esc(zh)}</tspan>${en ? `<tspan fill="${o.enColor || '#5b6878'}" dx="4">${esc(en)}</tspan>` : ''}</text></g>`;
}
const T = (x, y, s, o = {}) => `<text x="${x}" y="${y}" font-size="${o.size || 12}" fill="${o.color || '#1d2733'}" font-weight="${o.bold ? 700 : 400}" text-anchor="${o.anchor || 'start'}" ${o.halo ? 'stroke="#fff" stroke-width="3.2" paint-order="stroke"' : ''}>${esc(s)}</text>`;
const sbar = (x, y, k, txt = '1 mm') => `<rect x="${x - 6}" y="${y - 20}" width="${k + 12}" height="28" rx="5" fill="#fff" opacity="0.85"/><path d="M${x} ${y}h${k}" stroke="#1d2733" stroke-width="3"/>${T(x + k / 2, y - 7, txt, { size: 11, bold: true, anchor: 'middle' })}`;
const o = [], HEAD = 28;
function panel(id, PX, PY, PW, PH, title, note) {
  o.push(`<rect x="${PX}" y="${PY}" width="${PW}" height="${PH}" rx="9" fill="#fff" stroke="#d3dae1"/>`, `<clipPath id="c${id}"><rect x="${PX + 1}" y="${PY + HEAD}" width="${PW - 2}" height="${PH - HEAD - 1}" rx="7"/></clipPath>`);
  o.push(T(PX + 9, PY + 19, title, { size: 12, bold: true }), T(PX + PW - 8, PY + 19, note || '', { size: 10, color: '#5b6878', anchor: 'end' }));
}
const clipG = (id, tf, svg) => `<g clip-path="url(#c${id})"><g transform="${tf}">${svg}</g></g>`;

// ---------------------------------------------------------------- states (st.pk; OS, surgeon at 12)
const S = x => ({ pk: x });
const B = { soft: 0.6, edema: 0.12, haze: 0.45, old: { d: 7.0 }, nv: 1, dcele: {} };                                          // case B (sizes 示意)
const A = { kd: 10, edema: 0.3, haze: 0.3, dmek: {}, lens: 'iol', ac: 0.35, bombe: 0.35, pas: 1.0, li: {}, hy: {} };           // case A (amounts 示意)
const SB = x => S(Object.assign({}, B, x));
const PRE_B = SB({}), PRE_A = S(A);
const TRE = SB({ press: 0.6, tre: { depth: 0.6 }, inst: [{ kind: 'trephine' }] });                                              // partial depth (示意 60 %)
const SCIS = SB({ tre: { depth: 0.6, enter: { h: 12 }, scis: 200, dir: 1 }, ovd: 1, inst: [{ kind: 'scissors', h: 12 + 200 / 30, dir: 1 }] });
const OPEN = S({ old: { d: 7.0 }, nv: 1, tre: { scis: 360 }, open: 1, bulge: 1.6 });                                                  // open sky, diaphragm bulging (示意)
const OPENS = S({ old: { d: 7.0 }, nv: 1, tre: { scis: 360 }, open: 1, inst: [{ kind: 'forceps', h: 12, r: 4.3 }] });
const HELD = S({ tre: { scis: 360 }, open: 1, donor: { place: 0 } });                                                         // donor held above, endothelium down
const SEW = { nv: 1, old: { d: 7.0 }, tre: { scis: 360 }, open: 1, donor: {} };
const CARD4 = S(Object.assign({}, SEW, { sut: { placed: 4 } }));
const ALL = S(Object.assign({}, SEW, { sut: { placed: 16, bury: 1 } }));
const BSS = S(Object.assign({}, SEW, { sut: { placed: 16, bury: 1 }, ac: 1, inst: [{ kind: 'cannula', h: 6.375 }] }));
const LEAK = S(Object.assign({}, SEW, { sut: { placed: 16, bury: 1 }, fl: 1, leak: { h: 4, amt: 0.7 } }));

const OR = K.orient({ eye: 'OS', surgeon: 12 }), OS6 = K.orient({ eye: 'OS', view: 'section', h: 6 });
o.push(T(16, 30, 'PK（穿透性角膜移植）模型樣本：左眼 OS、術者坐 12 點', { size: 19, bold: true }));
o.push(T(1264, 30, `切面 ${OS6.left}–${OS6.right} 點（左＝12 點，上＝前）；大小與量是示意的見 CARD.md`, { size: 12, color: '#5b6878', anchor: 'end' }));
const COLS = [12, 265, 518, 771, 1024], PW = 244, PH2 = 212, ROWS = [42, 260, 478], CH = PH2 - HEAD;
const secPanel = (id, col, row, st, title, note, k, x0, y0, step = 0.03, hp = 6) => { const PX = COLS[col], PY = ROWS[row], c = cam(PX, PY + HEAD, k, x0, y0);
  const s = K.section({ st, h: hp, win: { x: x0, y: y0, w: (PW - 2) / k, h: CH / k }, step, id }); panel(id, PX, PY, PW, PH2, title, note); o.push(clipG(id, c.tf, s.svg)); return { s, A: s.A, P: c.P, PX, PY, k }; };
const scopePanel = (id, col, row, st, title, note, k = 13, cx = 0, cy = 0) => { const PX = COLS[col], PY = ROWS[row], x0 = cx - (PW - 2) / k / 2, y0 = cy - CH / k / 2, c = cam(PX, PY + HEAD, k, x0, y0);
  const e = K.enface({ st, id }); panel(id, PX, PY, PW, PH2, title, note); o.push(clipG(id, c.tf, e.svg)); return { e, A: e.A, P: c.P, PX, PY, M: e.M, k }; };
const orientBox = (PX, PY) => { const t1 = `${OR.text.split('　')[0]}　術者坐 ${OR.bottom} 點`, t2 = `下＝${OR.bottom} 點　左＝${OR.left} 點 ${OR.leftSide}`, tw = Math.max(meas(t1, 10, true), meas(t2, 10, true)) + 24;   // + margin: measured before the web font is in
  o.push(`<rect x="${PX + 6}" y="${PY + HEAD + 4}" width="${tw}" height="30" rx="4" fill="#1d2733" opacity="0.82"/>`, T(PX + 11, PY + HEAD + 16, t1, { size: 10, bold: true, color: '#fff' }), T(PX + 11, PY + HEAD + 29, t2, { size: 10, bold: true, color: '#fff' })); };
const WSEC = { k: 16, x: -7.5, y: -14.4 };                                                                                          // 12–6 overview window

// ================= row 1: case B and case A before surgery
{ const { A: a, P, PX, PY } = scopePanel('a', 0, 0, PRE_B, 'B 術前：術者視角', 'tectonic PK', 14, 0, 0.6);
  orientBox(PX, PY);
  o.push(lab('後彈力層膨出', 'descemetocele', PX + PW - 8, PY + 104, P(a.dcele), { side: 'R', bold: true, color: '#7a3b1e', lc: '#7a3b1e' }));
  o.push(lab('舊 DALK 交界', 'junction', PX + 8, PY + 196, P(a.old), { color: '#3c4a57' }));
  o.push(lab('360° 新生血管', 'NV', PX + PW - 8, PY + 196, P(a.nvPt), { side: 'R', color: '#b3262c', lc: '#b3262c' })); }
{ const { A: a, P, PX, PY, k } = secPanel('b', 1, 0, PRE_B, 'B 術前：12–6 點切面', '左＝12 點', WSEC.k, WSEC.x, WSEC.y);
  o.push(lab('descemetocele', '', PX + PW - 8, PY + 52, P(a.dcele), { side: 'R', bold: true, color: '#7a3b1e', lc: '#7a3b1e' }));
  o.push(lab('有晶體', 'phakic', PX + 8, PY + 196, P(a.lens), { color: '#3c4a57' }));
  o.push(lab('舊 graft', 'old graft', PX + 8, PY + 52, P(a.oldL), { color: '#3c4a57' }));
  o.push(T(PX + PW - 8, PY + 196, '軟眼：角膜下沉（示意）', { size: 10, color: '#5b6878', anchor: 'end', halo: true }));
  o.push(sbar(PX + 14, PY + 150, k)); }
{ const { A: a, P, PX, PY, k } = secPanel('c', 2, 0, PRE_B, 'descemetocele 放大', '大小示意', 80, 0.55, -13.25, 0.006);
  o.push(lab('只剩薄薄一層', 'thin layer', PX + 8, PY + 52, P(a.dcele), { bold: true, color: '#7a3b1e', lc: '#7a3b1e' }));
  o.push(lab('後面往前凸', 'bulging', PX + PW - 8, PY + 196, P(a.dceleBack), { side: 'R', color: '#3c4a57' }));
  o.push(sbar(PX + 14, PY + 196, k / 2, '0.5 mm')); }
{ const { A: a, P, PX, PY } = scopePanel('d', 3, 0, PRE_A, 'A 術前：術者視角', '角膜 10 mm', 14, 0, 0.6);
  o.push(lab('LI', '7 點', PX + PW - 8, PY + 52, P(a.li), { side: 'R', bold: true, color: '#7a2614', lc: '#7a2614' }));
  o.push(lab('前房積血', 'hyphema（平躺）', PX + 8, PY + 196, P(a.hy), { bold: true, color: '#86161b', lc: '#86161b' }));
  o.push(lab('DMEK 翹起', 'detached', PX + 8, PY + 52, P(a.dmek), { color: '#2f6f6a', lc: '#2f8f8a' })); }
{ const { A: a, P, PX, PY } = secPanel('e', 4, 0, PRE_A, 'A 術前：12–6 點切面', '左＝12 點', WSEC.k, WSEC.x, WSEC.y);
  o.push(lab('周邊虹膜貼角膜', 'PAS', PX + 8, PY + 196, P(a.pasL), { bold: true, color: '#4a2b19', lc: '#4a2b19' }));
  o.push(lab('DMEK', 'graft', PX + PW - 8, PY + 52, P(a.dmek6), { side: 'R', color: '#2f6f6a', lc: '#2f8f8a' }));
  o.push(lab('IOL', 'PCIOL', PX + PW - 8, PY + 196, P(a.iol), { side: 'R', color: '#7a6a1e', lc: '#7a6a1e' }));
  o.push(lab('hyphema', '', PX + 8, PY + 52, P(a.hy), { color: '#86161b', lc: '#86161b' })); }

// ================= row 2: trephination, scissors, open sky, donor
{ const { A: a, P, PX, PY, k } = secPanel('f', 0, 1, TRE, 'Trephine：先切部分深度', '6 點側', 46, 1.2, -13.5, 0.012);
  o.push(lab('trephine 7.5 mm', '依主刀', PX + 8, PY + 52, P(a.blade6), { bold: true, color: '#3c4a57' }));
  o.push(lab('約 60% 深', '示意', PX + PW - 8, PY + 120, P(a.treBot6), { side: 'R', color: '#3c4a57' }));
  o.push(lab('descemetocele', '', PX + 8, PY + 196, P(a.dcele), { color: '#7a3b1e', lc: '#7a3b1e' }));
  o.push(sbar(PX + PW - 14 - k, PY + 196, k)); }
{ const { A: a, P, PX, PY } = scopePanel('g', 1, 1, SCIS, '進前房、剪刀剪一圈', 'viscoelastic', 14, 0, 0.3);
  o.push(lab('全層', 'through', PX + 8, PY + 52, P(a.tre3), { bold: true, color: '#1f2a33' }));
  o.push(lab('部分深度', 'partial', PX + PW - 8, PY + 160, P(a.tre9), { side: 'R', color: '#5b6878' }));
  o.push(lab('角膜剪', 'scissors', PX + PW - 8, PY + 52, P(a.scissors), { side: 'R', color: '#3c4a57' }));
  o.push(lab('進前房處', 'entry', PX + 8, PY + 196, P(a.tre12), { color: '#3c4a57' })); }
{ const { A: a, P, PX, PY, k } = secPanel('h', 2, 1, OPEN, 'open sky：虹膜水晶體往前鼓', '危險（示意）', WSEC.k, WSEC.x, WSEC.y);
  o.push(lab('水晶體高過開口', 'lens', PX + PW - 8, PY + 52, P(a.lensFront), { side: 'R', bold: true, color: '#b3262c', lc: '#b3262c' }));
  o.push(lab('開口邊緣', 'host rim', PX + 8, PY + 52, P(a.hostEdgeL), { color: '#3c4a57' }));
  o.push(lab('虹膜', 'iris', PX + 8, PY + 196, P(a.irisL), { color: '#4a2b19', lc: '#4a2b19' })); }
{ const { A: a, P, PX, PY } = scopePanel('i', 3, 1, OPENS, 'open sky：術者視角', '不壓、不扳', 14, 0, 0.3);
  o.push(lab('host 切緣', 'cut edge', PX + PW - 8, PY + 52, P(a.hostEdge), { side: 'R', color: '#3c4a57' }));
  o.push(lab('0.12 鑷', 'forceps', PX + 8, PY + 196, P(a.forceps), { color: '#3c4a57' })); }
{ const { A: a, P, PX, PY } = secPanel('j', 4, 1, HELD, '供體：內皮面朝下', '+0.25 mm', 40, -1.2, -14.75, 0.012);
  o.push(lab('內皮', 'endothelium（朝下）', PX + 8, PY + 196, P(a.endo6), { bold: true, color: '#9a5f14', lc: '#c7832a' }));
  o.push(lab('供體 7.75', 'donor', PX + PW - 8, PY + 52, P(a.donorEdgeR), { side: 'R', color: '#3c6f93', lc: '#5d9bc4' }));
  o.push(lab('受體開口 7.5', '', PX + PW - 8, PY + 160, P(a.hostEdge), { side: 'R', color: '#3c4a57' })); }

// ================= row 3: sutures, BSS, Seidel, case A's LI and PAS
{ const { A: a, P, PX, PY } = scopePanel('k', 0, 2, CARD4, 'cardinal：12 → 6 → 3 → 9', '12 點先', 14, 0, 0.3);
  [12, 6, 3, 9].forEach((h, i) => { const q = P(a['sutOut' + h]), d = [q[0] - (PX + PW / 2), q[1] - (PY + HEAD + CH / 2 - 0.3 * 14)], l = Math.hypot(...d) || 1;
    const bx = q[0] - d[0] / l * 30, by = q[1] - d[1] / l * 30; o.push(`<circle cx="${bx}" cy="${by}" r="9" fill="#1d2733" stroke="#fff" stroke-width="1.5"/>`, T(bx, by + 4, String(i + 1), { size: 11, bold: true, color: '#fff', anchor: 'middle' })); });   // badge inside, on its suture's line
  o.push(T(PX + 8, PY + HEAD + 16, '12 點先（Lee 2012），其餘常規', { size: 10, color: '#5b6878', halo: true })); }
{ const { A: a, P, PX, PY, k } = secPanel('l', 1, 2, ALL, '縫線深度與埋結', '6 點側放大', 70, 2.35, -13.0, 0.006);
  o.push(lab('約 90% 深', '示意', PX + 8, PY + 196, P(a.sutDeep6), { bold: true, color: '#1f2a44' }));
  o.push(lab('線結埋在 host 側', 'buried', PX + PW - 8, PY + 52, P(a.knot6), { side: 'R', color: '#1f2a44' }));
  o.push(lab('供體', 'donor', PX + 8, PY + 52, P([a.sutDeep6[0] - 0.9, a.sutDeep6[1] - 0.25]), { color: '#3c6f93', lc: '#5d9bc4' }));
  o.push(sbar(PX + PW - 14 - k / 2, PY + 160, k / 2, '0.5 mm')); }
{ const { A: a, P, PX, PY } = secPanel('m', 2, 2, BSS, 'BSS 重建前房', '經 cannula 的切面', WSEC.k, WSEC.x, WSEC.y, 0.03, 6.375);
  o.push(lab('BSS cannula', '縫線之間', PX + PW - 8, PY + 52, P(a.cannula), { side: 'R', bold: true, color: '#3c4a57' }));
  o.push(lab('前房撐起', 'AC reformed', PX + 8, PY + 196, P(a.ac), { color: '#2a6f9a', lc: '#2a6f9a' })); }
{ const { A: a, P, PX, PY } = scopePanel('n', 3, 2, LEAK, 'watertight：Seidel', 'Romanchuk 1979', 14, 0, 0.3);
  o.push(lab('漏水處沖淡成亮綠細流', '', PX + 8, PY + 196, P(a.leak), { bold: true, color: '#1d6b3a', lc: '#1d6b3a' }));
  o.push(lab('16 針', 'interrupted', PX + PW - 8, PY + 52, P(a.sutOut9), { side: 'R', color: '#1f2a44' })); }
{ const { A: a, P, PX, PY, k } = secPanel('o', 4, 2, PRE_A, 'A：LI 與 PAS（1–7 點切面）', '右＝7 點', 46, 2.3, -12.3, 0.008, 7);
  o.push(lab('LI', '7 點', PX + 8, PY + 196, P(a.li), { bold: true, color: '#7a2614', lc: '#7a2614' }));
  o.push(lab('周邊虹膜貼角膜', 'PAS', PX + PW - 8, PY + 52, P(a.pas), { side: 'R', color: '#4a2b19', lc: '#4a2b19' }));
  o.push(sbar(PX + PW - 14 - k, PY + 196, k)); }
document.getElementById('stage').innerHTML = o.join('');
window.READY = true;
</script></body></html>
