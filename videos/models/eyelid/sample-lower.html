<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/package/400.css"><link rel="stylesheet" href="../fonts/package/700.css">
<style>html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#eceff2}svg text{font-family:'Noto Sans TC',sans-serif}</style>
</head><body>
<svg id="stage" width="1280" height="720" viewBox="0 0 1280 720"></svg>
<script src="lid.js"></script><script src="coronal.js"></script><script src="lower.js"></script><script src="lower-coronal.js"></script>
<script>
// Lower-lid anatomy sample: sagittal mechanism section + coronal (layer strips), synchronised. Right eye, Asian (sources: CARD.md 「下眼瞼」).
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const cv = document.createElement('canvas').getContext('2d');
const meas = (t, z, b) => { cv.font = `${b ? 700 : 400} ${z}px "Noto Sans TC"`; return cv.measureText(t).width; };
function cam(px, py, k, x0, y0) { return { tf: `translate(${px} ${py}) scale(${k}) translate(${-x0} ${-y0})`, P: p => [px + (p[0] - x0) * k, py + (p[1] - y0) * k] }; }
function lab(zh, en, tx, ty, a, o = {}) {
  const z = o.size || 13, right = o.side === 'R', w = meas(zh, z, o.bold) + (en ? 5 + meas(en, z, false) : 0), col = o.color || '#1f2a36', lc = o.lc || '#5f6d7b';
  const x1 = right ? tx - w - 6 : tx + w + 6, x0 = right ? tx - w : tx;
  const ln = a ? `<line x1="${x1}" y1="${ty - z * 0.36}" x2="${a[0]}" y2="${a[1]}" stroke="#fff" stroke-width="3" opacity="0.75"/><line x1="${x1}" y1="${ty - z * 0.36}" x2="${a[0]}" y2="${a[1]}" stroke="${lc}" stroke-width="1.05"/><circle cx="${a[0]}" cy="${a[1]}" r="2.5" fill="${lc}" stroke="#fff" stroke-width="1"/>` : '';
  return `<g>${ln}<text x="${x0}" y="${ty}" font-size="${z}" stroke="#fff" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round"><tspan fill="${col}" font-weight="${o.bold ? 700 : 500}">${esc(zh)}</tspan>${en ? `<tspan fill="${o.enColor || '#5b6878'}" dx="5">${esc(en)}</tspan>` : ''}</text></g>`;
}
const o = [];
o.push(`<text x="24" y="38" font-size="21" font-weight="700" fill="#1d2733">下眼瞼模型樣本（亞洲人）：矢狀切面＋正面同步</text>`);
o.push(`<text x="1256" y="38" font-size="13" fill="#5b6878" text-anchor="end">右眼　mm 建模，示意圖　綠色虛線＝兩圖對應的切面位置</text>`);

// ================= sagittal panel (lower lid, mid-pupil)
const PX = 16, PY = 56, PW = 588, PH = 650, K1 = 21.0, X0 = -19.6, Y0 = 2.2;
const c1 = cam(PX, PY, K1, X0, Y0), P = c1.P;
const sag = LOWER.draw({ state: {}, id: 'ls' }), A = sag.A;
o.push(`<rect x="${PX}" y="${PY}" width="${PW}" height="${PH}" rx="10" fill="#fff" stroke="#d3dae1"/>`);
o.push(`<clipPath id="p1"><rect x="${PX + 1}" y="${PY + 1}" width="${PW - 2}" height="${PH - 64}" rx="9"/></clipPath><g clip-path="url(#p1)"><g transform="${c1.tf}">${sag.svg}</g></g>`);
const fu = P(A.fusionL);
o.push(`<circle cx="${fu[0]}" cy="${fu[1]}" r="9" fill="none" stroke="#0e7c6b" stroke-width="2.2"/>`);
o.push(`<text x="${PX + 16}" y="${PY + 26}" font-size="15" font-weight="700" fill="#1d2733">矢狀切面 sagittal（下眼瞼）</text><text x="${PX + PW - 14}" y="${PY + 26}" font-size="12.5" fill="#5b6878" text-anchor="end">左＝前　上＝上</text>`);
const L = [], lx = PX + 14, rx = PX + PW - 12;
L.push(lab('角膜', 'cornea', lx, 112, P([-12.4, 3.6])));
L.push(lab('睫毛', 'eyelashes', lx, 150, P(A.lashL)));
L.push(lab('瞼板', 'tarsus', lx, 186, P(A.tarsusL), { bold: true }));
L.push(lab('瞼板前眼輪匝肌', 'pretarsal orbicularis', lx, 222, P(A.orbPT)));
L.push(lab('眶隔前眼輪匝肌', 'preseptal orbicularis', lx, 262, P(A.orbPS)));
L.push(lab('眶隔', 'orbital septum', lx, 300, P(A.septumL), { bold: true }));
L.push(lab('皮膚', 'skin', lx, 336, P(A.skinL)));
L.push(lab('眶下緣', 'inferior orbital rim', lx, 512, P(A.rimL)));
L.push(lab('上頜竇', 'maxillary sinus', lx, 560, P([-3.2, 22.0])));
L.push(lab('結膜', 'conjunctiva', rx, 156, P(A.conjL), { side: 'R' }));
L.push(lab('下瞼板肌', 'inferior tarsal muscle', rx, 210, P(A.itm), { side: 'R', bold: true }));
L.push(lab('囊瞼筋膜', 'capsulopalpebral fascia', rx, 244, P(A.cpf), { side: 'R', bold: true }));
L.push(lab('下穹窿', 'inferior fornix', rx, 486, P(A.fornixL), { side: 'R' }));
L.push(lab('下直肌', 'inferior rectus', rx, 120, P(A.ir), { side: 'R' }));
L.push(lab('眶隔與囊瞼筋膜融合處', 'fusion', rx, 352, [fu[0] + 6, fu[1] + 6], { side: 'R', bold: true, color: '#0e7c6b', lc: '#0e7c6b' }));
L.push(lab('中央脂肪墊', 'central fat pad', rx, 396, P(A.fatL), { side: 'R' }));
L.push(lab('下斜肌（位置示意）', 'inferior oblique', rx, 442, P([A.io[0] - 0.6, A.io[1] + 0.3]), { side: 'R' }));
o.push(L.join(''));
o.push(`<line x1="${PX + 1}" y1="${PY + PH - 63}" x2="${PX + PW - 1}" y2="${PY + PH - 63}" stroke="#e1e6eb"/>`);
o.push(`<text x="${PX + 16}" y="${PY + PH - 38}" font-size="13" fill="#1f2a36">瞼板高 4.1 mm（Lim 2004）；眶隔在瞼板下緣下方 <tspan font-weight="700">2.4 mm</tspan> 與囊瞼筋膜融合（Kakizaki 2006）；</text>`);
o.push(`<text x="${PX + 16}" y="${PY + PH - 17}" font-size="13" fill="#1f2a36">retractors 分兩層（Kakizaki 2009）；眶下緣在角膜頂點後 7.8 mm（Kato 2025）。</text>`);

// ================= coronal panel (lower lid opened layer by layer, temporal → nasal)
const QX = 616, QY = 56, QW = 648, QH = 650, K2 = 18.4, ZX0 = -20.6, ZY0 = -6.5;
const c2 = cam(QX, QY, K2, ZX0, ZY0), Q = c2.P;
const strips = [[-17, -11.5, 5], [-11.5, -7, 4], [-7, -1, 3], [-1, 3, 2], [3, 6.5, 1], [6.5, 8.5, 0], [8.5, 13.6, 3]];
const cor = CORONAL.draw({ variant: 'asian', lower: { lstrips: strips }, id: 'cz' }), B = cor.A;
o.push(`<rect x="${QX}" y="${QY}" width="${QW}" height="${QH}" rx="10" fill="#fff" stroke="#d3dae1"/>`);
o.push(`<clipPath id="p2"><rect x="${QX + 1}" y="${QY + 1}" width="${QW - 2}" height="${QH - 64}" rx="9"/></clipPath><g clip-path="url(#p2)"><g transform="${c2.tf}">${cor.svg}</g></g>`);
o.push(`<rect x="${QX + 1}" y="${QY + 1}" width="${QW - 2}" height="36" rx="9" fill="#fff" opacity="0.88"/>`);
o.push(`<text x="${QX + 16}" y="${QY + 26}" font-size="15" font-weight="700" fill="#1d2733">正面 coronal</text><text x="${QX + QW - 14}" y="${QY + 26}" font-size="12.5" fill="#5b6878" text-anchor="end">檢查者面對病人：左＝temporal　右＝nasal</text>`);
const hy = [604, 626];
[['眼輪匝肌', 'orbicularis', -14.2], ['眶隔', 'septum', -9.2], ['脂肪墊', 'fat pads', -4.0], ['囊瞼筋膜', 'CPF', 1.0], ['瞼板層', 'tarsal', 4.75], ['結膜', 'conj.', 7.5], ['脂肪墊、下斜肌', 'fat, IO', 11.0]].forEach(([zh, en, x], i) => {
  const p = Q([x, cor.rimLY(x) + 1.0]), z = 12.0, w = meas(zh, z, true) + 4 + meas(en, z);
  const y = hy[i % 2], cx = Math.max(QX + 8 + w / 2, Math.min(QX + QW - 8 - w / 2, p[0]));
  o.push(`<line x1="${p[0]}" y1="${y - 14}" x2="${p[0]}" y2="${p[1] + 2}" stroke="#7a4f45" stroke-width="1"/>`);
  o.push(`<text x="${cx}" y="${y}" font-size="${z}" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke"><tspan font-weight="700" fill="#1f2a36">${zh}</tspan><tspan dx="4" fill="#5b6878">${en}</tspan></text>`);
});
const M = [], mx = QX + 12, mr = QX + QW - 12;
M.push(lab('下瞼緣', 'lower lid margin', mx, 118, Q([-9.0, CORONAL.Ly(-9.0)])));
M.push(lab('眼輪匝肌', 'orbicularis', mx, 352, Q([-15.5, 9.0])));
M.push(lab('眶隔', 'orbital septum', mx, 390, Q([-9.6, 12.0]), { bold: true }));
M.push(lab('融合處', 'fusion', mx, 268, Q([-9.0, cor.fusLY(-9.0)]), { bold: true, color: '#0e7c6b', lc: '#0e7c6b' }));
M.push(lab('外側脂肪墊', 'lateral fat pad', mx, 428, Q([-6.3, 12.6])));
M.push(lab('弓狀擴張', 'arcuate expansion', mx, 466, Q([-5.3, (cor.fusLY(-5) + cor.rimLY(-5)) / 2 + 0.8])));
M.push(lab('眶下緣', 'inferior orbital rim', mx, 540, Q([-13.5, cor.rimLY(-13.5) + 0.3])));
M.push(lab('中央脂肪墊', 'central fat pad', mx, 504, Q([-2.6, 13.0])));
M.push(lab('囊瞼筋膜', 'capsulopalpebral fascia', mr, 118, Q([1.6, cor.fornixLY(1.6) - 0.6]), { side: 'R', bold: true }));
M.push(lab('瞼板', 'tarsus', mr, 156, Q([4.6, (CORONAL.Ly(4.6) + cor.tarBotLY(4.6)) / 2]), { side: 'R', bold: true }));
M.push(lab('下瞼板肌', 'inferior tarsal muscle', mr, 196, Q([5.6, cor.fornixLY(5.6) - 0.9]), { side: 'R', bold: true }));
M.push(lab('下穹窿結膜', 'conjunctiva', mr, 236, Q([7.6, cor.fornixLY(7.6) - 1.2]), { side: 'R' }));
M.push(lab('下斜肌（示意）', 'inferior oblique', mr, 452, Q([10.6, cor.rimLY(10.6) - 1.0]), { side: 'R', bold: true }));
M.push(lab('內側脂肪墊', 'medial fat pad', mr, 412, Q([12.4, cor.fusLY(12.4) + 1.2]), { side: 'R' }));
M.push(lab('矢狀切面位置', 'sagittal plane', mr, 540, Q([0, 18.4]), { side: 'R', color: '#0e7c6b', lc: '#0e7c6b' }));
o.push(M.join(''));
o.push(`<line x1="${QX + 1}" y1="${QY + QH - 63}" x2="${QX + QW - 1}" y2="${QY + QH - 63}" stroke="#e1e6eb"/>`);
o.push(`<text x="${QX + 16}" y="${QY + QH - 38}" font-size="13" fill="#1f2a36">下眼瞼由外（temporal）到內逐層打開；每一層的高度由左圖矢狀切面換算，</text>`);
o.push(`<text x="${QX + 16}" y="${QY + QH - 17}" font-size="13" fill="#1f2a36">脂肪墊分三區、下斜肌在內側與中央之間（Coban 2023）；大小與下斜肌位置是示意。</text>`);
document.getElementById('stage').innerHTML = o.join('');
</script></body></html>
