<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/package/400.css"><link rel="stylesheet" href="../fonts/package/700.css">
<style>html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#eceff2}svg text{font-family:'Noto Sans TC',sans-serif}</style>
</head><body>
<svg id="stage" width="1280" height="720" viewBox="0 0 1280 720"></svg>
<script src="lid.js"></script><script src="coronal.js"></script>
<script>
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const cv = document.createElement('canvas').getContext('2d');
const meas = (t, z, b) => { cv.font = `${b ? 700 : 400} ${z}px "Noto Sans TC"`; return cv.measureText(t).width; };
function cam(px, py, k, x0, y0) { return { tf: `translate(${px} ${py}) scale(${k}) translate(${-x0} ${-y0})`, P: p => [px + (p[0] - x0) * k, py + (p[1] - y0) * k] }; }
// bilingual label: Chinese (ink) + English (grey), leader to anchor a
function lab(zh, en, tx, ty, a, o = {}) {
  const z = o.size || 13, right = o.side === 'R', w = meas(zh, z, o.bold) + (en ? 5 + meas(en, z, false) : 0), col = o.color || '#1f2a36', lc = o.lc || '#5f6d7b';
  const x1 = right ? tx - w - 6 : tx + w + 6, x0 = right ? tx - w : tx;
  const ln = a ? `<line x1="${x1}" y1="${ty - z * 0.36}" x2="${a[0]}" y2="${a[1]}" stroke="#fff" stroke-width="3" opacity="0.75"/><line x1="${x1}" y1="${ty - z * 0.36}" x2="${a[0]}" y2="${a[1]}" stroke="${lc}" stroke-width="1.05"/><circle cx="${a[0]}" cy="${a[1]}" r="2.5" fill="${lc}" stroke="#fff" stroke-width="1"/>` : '';
  return `<g>${ln}<text x="${x0}" y="${ty}" font-size="${z}" stroke="#fff" stroke-width="3.4" paint-order="stroke" stroke-linejoin="round"><tspan fill="${col}" font-weight="${o.bold ? 700 : 500}">${esc(zh)}</tspan>${en ? `<tspan fill="${o.enColor || '#5b6878'}" dx="5">${esc(en)}</tspan>` : ''}</text></g>`;
}
const o = [];
o.push(`<text x="24" y="38" font-size="21" font-weight="700" fill="#1d2733">眼瞼模型樣本（亞洲人單眼皮）：矢狀切面＋正面同步</text>`);
o.push(`<text x="1256" y="38" font-size="13" fill="#5b6878" text-anchor="end">右眼　mm 建模，示意圖　綠色虛線＝兩圖對應的切面位置</text>`);

// ================= sagittal panel
const PX = 16, PY = 56, PW = 588, PH = 650, K1 = 17.6, X0 = -28.9, Y0 = -29.3;
const c1 = cam(PX, PY, K1, X0, Y0), P = c1.P;
const sag = LID.draw({ variant: 'asian' }), A = sag.A;
o.push(`<rect x="${PX}" y="${PY}" width="${PW}" height="${PH}" rx="10" fill="#fff" stroke="#d3dae1"/>`);
o.push(`<clipPath id="p1"><rect x="${PX + 1}" y="${PY + 1}" width="${PW - 2}" height="${PH - 64}" rx="9"/></clipPath><g clip-path="url(#p1)"><g transform="${c1.tf}">${sag.svg}</g></g>`);
const fu = P(A.fusion);
o.push(`<circle cx="${fu[0]}" cy="${fu[1]}" r="9" fill="none" stroke="#0e7c6b" stroke-width="2.2"/>`);
o.push(`<text x="${PX + 16}" y="${PY + 26}" font-size="15" font-weight="700" fill="#1d2733">矢狀切面 sagittal</text><text x="${PX + PW - 14}" y="${PY + 26}" font-size="12.5" fill="#5b6878" text-anchor="end">左＝前　上＝上</text>`);
const L = [], lx = PX + 14, rx = PX + PW - 12;
L.push(lab('眶上緣', 'superior orbital rim', lx, 96, P([-12.9, -24.5])));
L.push(lab('腱膜前脂肪', 'preaponeurotic fat', lx, 168, P(A.fat)));
L.push(lab('眶隔', 'orbital septum', lx, 200, P(A.septum), { bold: true }));
L.push(lab('眼輪匝肌', 'orbicularis oculi', lx, 232, P(A.orb)));
L.push(lab('皮下脂肪', 'subcutaneous fat', lx, 264, P(A.subq)));
L.push(lab('皮膚', 'skin', lx, 296, P(A.skin)));
L.push(lab('瞼板前脂肪', 'pretarsal fat', lx, 352, P(A.pretarsalFat)));
L.push(lab('睫毛', 'eyelashes', lx, 470, P(A.lash)));
L.push(lab('角膜', 'cornea', lx, 600, P(A.cornea)));
L.push(lab('提上瞼肌', 'levator', rx, 96, P(LID.LEV.off(LID.S_J + 1.2, 0.9)), { side: 'R', bold: true }));
L.push(lab('提上瞼肌腱膜', 'levator aponeurosis', rx, 128, P(A.apo), { side: 'R', bold: true }));
L.push(lab('穆勒氏肌', 'Müller muscle', rx, 160, P(A.muller), { side: 'R', bold: true }));
L.push(lab('上直肌', 'superior rectus', rx, 400, P(A.sr), { side: 'R' }));
L.push(lab('上穹窿', 'superior fornix', rx, 432, P(A.fornix), { side: 'R' }));
L.push(lab('眶隔與腱膜融合處', 'fusion', rx, 470, [fu[0] + 6, fu[1] + 6], { side: 'R', bold: true, color: '#0e7c6b', lc: '#0e7c6b' }));
L.push(lab('瞼板', 'tarsus', rx, 504, P(A.tarsus), { side: 'R', bold: true }));
L.push(lab('結膜', 'conjunctiva', rx, 536, P(A.conj), { side: 'R' }));
o.push(L.join(''));
o.push(`<line x1="${PX + 1}" y1="${PY + PH - 63}" x2="${PX + PW - 1}" y2="${PY + PH - 63}" stroke="#e1e6eb"/>`);
o.push(`<text x="${PX + 16}" y="${PY + PH - 38}" font-size="13" fill="#1f2a36"><tspan font-weight="700" fill="#0e7c6b">亞洲人單眼皮</tspan>：眶隔在瞼板上緣<tspan font-weight="700">下方</tspan>與腱膜融合，腱膜前脂肪降到瞼板前；</text>`);
o.push(`<text x="${PX + 16}" y="${PY + PH - 17}" font-size="13" fill="#1f2a36">另有瞼板前脂肪、較厚的皮下脂肪，沒有 crease。來源：Jeong 1999（融合高度為示意）</text>`);

// ================= coronal panel
const QX = 616, QY = 56, QW = 648, QH = 650, K2 = 15.6, ZX0 = -21.6, ZY0 = -27.9;
const c2 = cam(QX, QY, K2, ZX0, ZY0), Q = c2.P;
const W = [CORONAL.strip(-10.5, -4.5, 5), CORONAL.strip(-4.5, 1.5, 4), CORONAL.strip(1.5, 5.5, 2), CORONAL.strip(5.5, 10.5, 1)];
const cor = CORONAL.draw({ variant: 'asian', windows: W, id: 'cz' }), B = cor.A;
o.push(`<rect x="${QX}" y="${QY}" width="${QW}" height="${QH}" rx="10" fill="#fff" stroke="#d3dae1"/>`);
o.push(`<clipPath id="p2"><rect x="${QX + 1}" y="${QY + 1}" width="${QW - 2}" height="${QH - 64}" rx="9"/></clipPath><g clip-path="url(#p2)"><g transform="${c2.tf}">${cor.svg}</g></g>`);
o.push(`<text x="${QX + 16}" y="${QY + 26}" font-size="15" font-weight="700" fill="#1d2733">正面 coronal</text><text x="${QX + QW - 14}" y="${QY + 26}" font-size="12.5" fill="#5b6878" text-anchor="end">檢查者面對病人：左＝temporal　右＝nasal</text>`);
// strip headers (layer opened in each strip)
const hy = [62, 84];
[['皮膚', 'skin', -13.8], ['眼輪匝肌', 'orbicularis', -7.5], ['眶隔', 'septum', -1.5], ['腱膜', 'aponeurosis', 3.5], ['瞼板層', 'tarsal layer', 8.0]].forEach(([zh, en, x], i) => {
  const p = Q([x, -21.4]), t = `${zh} ${en}`, z = 12.5, w = meas(zh, z, true) + 4 + meas(en, z);
  const y = QY + hy[i % 2] - 18 + 36, cx = Math.max(QX + 8 + w / 2, Math.min(QX + QW - 8 - w / 2, p[0]));
  o.push(`<line x1="${p[0]}" y1="${y + 5}" x2="${p[0]}" y2="${p[1] - 2}" stroke="#7a4f45" stroke-width="1"/>`);
  o.push(`<text x="${cx}" y="${y}" font-size="${z}" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke"><tspan font-weight="700" fill="#1f2a36">${zh}</tspan><tspan dx="4" fill="#5b6878">${en}</tspan></text>`);
});
const M = [], mx = QX + 12, mr = QX + QW - 12;
M.push(lab('眶緣', 'orbital rim', mx, 226, Q(B.rim)));
M.push(lab('腱膜前脂肪', 'preaponeurotic fat', mx, 262, Q(B.fat)));
M.push(lab('融合處', 'fusion', mx, 298, Q(B.fusion), { bold: true, color: '#0e7c6b', lc: '#0e7c6b' }));
M.push(lab('瞼板前脂肪', 'pretarsal fat', mx, 334, Q(B.ptfat)));
M.push(lab('Whitnall 韌帶', 'Whitnall ligament', mr, 190, Q(B.whit), { side: 'R' }));
M.push(lab('穆勒氏肌', 'Müller muscle', mr, 226, Q(B.muller), { side: 'R', bold: true }));
M.push(lab('瞼板', 'tarsus', mr, 262, Q(B.tarsus), { side: 'R', bold: true }));
M.push(lab('內眥贅皮', 'epicanthal fold', mr, 470, Q(B.epi), { side: 'R' }));
M.push(lab('矢狀切面位置', 'sagittal plane', mr, 548, Q([0, 6.2]), { side: 'R', color: '#0e7c6b', lc: '#0e7c6b' }));
o.push(M.join(''));
o.push(`<line x1="${QX + 1}" y1="${QY + QH - 63}" x2="${QX + QW - 1}" y2="${QY + QH - 63}" stroke="#e1e6eb"/>`);
o.push(`<text x="${QX + 16}" y="${QY + QH - 38}" font-size="13" fill="#1f2a36">上眼瞼由外（temporal）到內逐層打開；每一層的高度由左圖矢狀切面換算，</text>`);
o.push(`<text x="${QX + 16}" y="${QY + QH - 17}" font-size="13" fill="#1f2a36">所以綠色虛線上看到的高度，和左圖完全對得起來。手術時兩圖同步顯示。</text>`);
document.getElementById('stage').innerHTML = o.join('');
</script></body></html>
