<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/package/400.css"><link rel="stylesheet" href="../fonts/package/700.css">
<style>html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#eceff2}svg text{font-family:'Noto Sans TC',sans-serif}</style>
</head><body>
<svg id="stage" width="1280" height="720" viewBox="0 0 1280 720"></svg>
<script src="lid.js"></script><script src="lower.js"></script>
<script>
// The lower-lid states of the sagittal model, one panel per step (videos/src/lower-lid-entropion-revision, chapter 1 and 4).
// Department template (marginal rotation; Hotz): heights and suture positions are parameters, to be confirmed from the OP note (schematic).
const ent = { entr: 1, dehis: 1, override: 1 }, mild = { entr: 0.85, dehis: 1, override: 0.6, scar: 1 };
const inc = { ...mild, subcil: 1 }, dis = { ...inc, plane: 1, septOpen: 1, retrOpen: 1 }, fr = { ...dis, frac: 1 }, mat = { ...fr, mattress: 1 }, tie = { ...mat, tie: 1, override: 0 };
const hotz = { entr: 0.85, hotzExc: 1, septOpen: 1, hotzFat: 1, hotzFix: 1, tie: 0.9 };
const STEPS = [
  ['Involutional entropion', 'retractors 鬆脫、眼輪匝肌上跨', ent, '老年性內翻'], ['前次手術的疤痕（示意）', 'previous scar', mild, null],
  ['睫毛下 2.5 mm 切皮', 'subciliary incision', inc, null], ['剝開眶隔與 retractor 到結膜', 'septum + retractors opened', dis, null],
  ['瞼板切一半深度', 'tarsal fracture', fr, null], ['Mattress suture', '4-0 vicryl（位置示意）', mat, '外翻縫線'],
  ['綁緊：瞼緣外轉、睫毛離開角膜', 'tied, everted', tie, null], ['Hotz：切除皮膚肌肉、固定到 retractor', 'Hotz fixation', hotz, null]];
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const o = [`<text x="24" y="38" font-size="21" font-weight="700" fill="#1d2733">下眼瞼 entropion 與矯正的矢狀切面狀態（右眼，亞洲人）</text>`,
  `<text x="1256" y="38" font-size="13" fill="#5b6878" text-anchor="end">示意；切口、瞼板切開、縫線位置依院內常規，待刀後確認</text>`];
const PW = 304, PH = 318, K = 18.0, X0 = -17.6, Y0 = -0.6;
STEPS.forEach(([zh, en, st, zh0], i) => {
  const px = 16 + (i % 4) * (PW + 8), py = 56 + Math.floor(i / 4) * (PH + 8), id = 'p' + i, r = LOWER.draw({ state: st, id });
  o.push(`<rect x="${px}" y="${py}" width="${PW}" height="${PH}" rx="9" fill="#fff" stroke="#d3dae1"/>`);
  o.push(`<clipPath id="${id}C"><rect x="${px + 1}" y="${py + 1}" width="${PW - 2}" height="${PH - 2}" rx="8"/></clipPath><g clip-path="url(#${id}C)"><g transform="translate(${px} ${py}) scale(${K}) translate(${-X0} ${-Y0})">${r.svg}</g></g>`);
  o.push(`<rect x="${px + 1}" y="${py + 1}" width="${PW - 2}" height="52" rx="8" fill="#fff" opacity="0.86"/>`);
  o.push(`<circle cx="${px + 20}" cy="${py + 20}" r="12" fill="#1d2733"/><text x="${px + 20}" y="${py + 25}" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">${i + 1}</text>`);
  o.push(`<text x="${px + 38}" y="${py + 25}" font-size="13.5"><tspan font-weight="700" fill="#1f2a36">${esc(zh0 ? zh0 + ' ' : '')}${esc(zh)}</tspan></text>`);
  o.push(`<text x="${px + 38}" y="${py + 43}" font-size="12" fill="#5b6878">${esc(en)}</text>`);
});
document.getElementById('stage').innerHTML = o.join('');
</script></body></html>
