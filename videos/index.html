      {c:'Gonzalez A, et al. Cornea 2016;35:1391-1395.', doi:'10.1097/ICO.0000000000001015'},
      {c:'Maier AKB, et al. Cornea 2016;35:308-312.', doi:'10.1097/ICO.0000000000000740'},
      {c:'Parker JS, et al. Cornea 2023;42:32-35.', doi:'10.1097/ICO.0000000000003000'},
      {c:'Roberts HW, et al. Eye 2023;37:3492-3495.', doi:'10.1038/s41433-023-02542-8'},
      {c:'Dirisamer M, et al. Arch Ophthalmol 2012;130:280-291.', doi:'10.1001/archophthalmol.2011.343'},
      {c:'Price MO, et al. Cornea 2014;33:880-886.', doi:'10.1097/ICO.0000000000000206'},
    ],
  },
];

/* ---------- app ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = t => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');
const catName = id => (CATS.find(c => c.id === id) || {zh:''}).zh;
const nChapters = v => v.chapters ? v.chapters.reduce((n, g) => n + g.items.length, 0) : 0;
const posterOf = v => v.poster || (v.type === 'youtube' && v.yt ? `https://i.ytimg.com/vi/${encodeURIComponent(v.yt)}/hqdefault.jpg` : '');
const PLAY = '<svg class="play" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="21" fill="var(--surface)" opacity=".92"/><path d="M18 14.5L30.5 22L18 29.5Z" fill="var(--accent)"/></svg>';
const YT_HOST = 'https://www.youtube-nocookie.com';
let cat = 'all', cleanup = null, renderToken = 0, ytApi = null;

/* YouTube IFrame API：第一次打開 YouTube 影片時才載入；載入失敗就退回一般嵌入 */
function loadYT(){
  if (!ytApi) ytApi = new Promise((resolve, reject) => {
    if (window.YT && window.YT.Player) return resolve(window.YT);
    let done = false;
    window.onYouTubeIframeAPIReady = () => { done = true; resolve(window.YT); };
    const fail = () => { if (!done) { done = true; ytApi = null; reject(new Error('YouTube API unavailable')); } };
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    s.onerror = fail;
    document.head.appendChild(s);
    setTimeout(fail, 10000);
  });
  return ytApi;
}

function renderChips(){
  const all = [{id:'all', zh:'全部'}, ...CATS];
  $('#chips').innerHTML = all.map(c => {
    const n = c.id === 'all' ? VIDEOS.length : VIDEOS.filter(v => v.cat === c.id).length;
    return `<button type="button" class="chip" data-cat="${c.id}" aria-pressed="${c.id === cat}">${esc(c.zh)}<span class="n">${n}</span></button>`;
  }).join('');
}

function renderList(){
  renderChips();
  const list = VIDEOS.filter(v => cat === 'all' || v.cat === cat);
  $('#vlist').innerHTML = list.map(v => {
    const tags = [...(v.tags || [])];
    if (nChapters(v)) tags.push(nChapters(v) + ' 個章節');
    if (v.refs && v.refs.length) tags.push(v.refs.length + ' 篇文獻');
    return `<li><a class="vcard" href="#${encodeURIComponent(v.id)}">
      <div class="poster">${posterOf(v) ? `<img src="${esc(posterOf(v))}" alt="" loading="lazy">` : ''}${PLAY}${v.dur ? `<span class="dur">${fmt(v.dur)}</span>` : ''}</div>
      <div>
        <div class="cat">${esc(catName(v.cat))}</div>
        <h2>${esc(v.zh)}<span class="en">${esc(v.en)}</span></h2>
        <p>${esc(v.short)}</p>
        <div class="tags">${tags.map(t => `<span>${esc(t)}</span>`).join('')}</div>
      </div>
    </a></li>`;
  }).join('');
  $('#empty').hidden = list.length > 0;
}

function renderDetail(v){
  $('#d-title').innerHTML = `${esc(v.zh)}<span class="en">${esc(v.en)}</span>`;
  const meta = [catName(v.cat)];
  if (v.dur) meta.push('片長 ' + fmt(v.dur));
  if (nChapters(v)) meta.push(nChapters(v) + ' 個章節');
  if (v.refs && v.refs.length) meta.push(v.refs.length + ' 篇參考文獻');
  $('#d-meta').innerHTML = meta.map(m => `<span>${esc(m)}</span>`).join('');

  /* 播放器：seek(t) 跳到第 t 秒，now() 回傳目前秒數（取不到時回傳 null） */
  const screen = $('#d-screen');
  const token = ++renderToken;
  let seek = null, now = () => null, player = null, plainYT = false, timer = null;
  if (v.type === 'youtube') {
    const embed = start => `${YT_HOST}/embed/${encodeURIComponent(v.yt)}?rel=0&playsinline=1${start != null ? `&start=${start}&autoplay=1` : ''}`;
    const plain = start => {
      plainYT = true;
      screen.querySelector('.yt').innerHTML = `<iframe src="${esc(embed(start))}" title="${esc(v.zh)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
    };
    screen.innerHTML = '<div class="yt"><div id="yt-player"></div></div>';
    loadYT().then(YT => {
      if (token !== renderToken) return;
      player = new YT.Player('yt-player', {host: YT_HOST, videoId: v.yt, width: '100%', height: '100%', playerVars: {rel: 0, playsinline: 1}});
    }).catch(() => { if (token === renderToken) plain(); });
    const ready = () => !plainYT && player && typeof player.seekTo === 'function';
    seek = t => { if (ready()) { player.seekTo(t, true); player.playVideo(); } else plain(t); };
    now = () => ready() ? player.getCurrentTime() : null;
  } else if (v.type === 'anim') {
    screen.innerHTML = `<iframe src="${esc(v.src)}" title="${esc(v.zh)}" loading="lazy"></iframe>`;
  } else {
    screen.innerHTML = `<video controls preload="metadata" playsinline ${v.poster ? `poster="${esc(v.poster)}"` : ''} src="${esc(v.src)}"></video>`;
    const video = screen.querySelector('video');
    seek = t => { video.currentTime = t; video.play().catch(() => {}); };
    now = () => video.currentTime;
  }
  $('#d-sum').textContent = v.sum || v.short;
  $('#d-note').hidden = !v.note;
  $('#d-note').textContent = v.note || '';

  const hasCh = !!(v.chapters && v.chapters.length);
  $('#d-ch-h').hidden = $('#d-chapters').hidden = !hasCh;
  $('#d-chapters').innerHTML = hasCh ? v.chapters.map(g => `<li class="grp">
      ${g.g ? `<div class="grp-h">${esc(g.g)}</div>` : ''}
      <ol>${g.items.map(([t, label]) => `<li><button type="button" class="ch" data-t="${t}" ${seek ? '' : 'disabled'}><span class="ts">${fmt(t)}</span><span>${esc(label)}</span></button></li>`).join('')}</ol>
    </li>`).join('') : '';

  const refs = v.refs || [];
  $('#d-refs-box').hidden = !refs.length;
  $('#d-refs-sum').textContent = `參考文獻（${refs.length} 篇）`;
  $('#d-refs').innerHTML = refs.map(r => {
    const href = r.doi ? 'https://doi.org/' + r.doi : r.url;
    const label = r.doi ? 'doi:' + r.doi : '連結';
    return `<li>${esc(r.c)} <a href="${esc(href)}" target="_blank" rel="noopener">${esc(label)}</a></li>`;
  }).join('');

  if (seek && hasCh) {
    const btns = [...document.querySelectorAll('#d-chapters .ch')];
    const times = btns.map(b => +b.dataset.t);
    const mark = cur => {
      if (cur == null) return;
      let i = -1;
      times.forEach((t, k) => { if (cur + 0.3 >= t) i = k; });
      btns.forEach((b, k) => b.setAttribute('aria-current', k === i ? 'true' : 'false'));
    };
    btns.forEach(b => b.addEventListener('click', () => { seek(+b.dataset.t); mark(+b.dataset.t); }));
    const video = screen.querySelector('video');
    if (video) ['timeupdate', 'seeked'].forEach(e => video.addEventListener(e, () => mark(now())));
    else timer = setInterval(() => mark(now()), 500);
  }
  cleanup = () => {
    clearInterval(timer);
    const video = screen.querySelector('video');
    if (video) video.pause();
    if (player && typeof player.destroy === 'function') player.destroy();
    screen.innerHTML = '';
  };
  document.title = `${v.zh} · 教學影片 · ophlearning`;
}

function route(){
  if (cleanup) { cleanup(); cleanup = null; }
  renderToken++;
  const id = decodeURIComponent(location.hash.slice(1));
  const v = VIDEOS.find(x => x.id === id);
  $('#list-view').hidden = !!v;
  $('#detail-view').hidden = !v;
  if (v) renderDetail(v);
  else { document.title = '教學影片 · ophlearning'; renderList(); }
  window.scrollTo(0, 0);
}

$('#chips').addEventListener('click', e => {
  const b = e.target.closest('.chip');
  if (!b) return;
  cat = b.dataset.cat;
  renderList();
});
addEventListener('hashchange', route);
route();
</script>
</body>
</html>
