    id:'sutured-scleral-iol-fixation', type:'youtube', yt:'ZUVTH0jOdew', cat:'surgery',
    zh:'鞏膜縫合固定 IOL：從外面找到睫狀溝', en:'Sutured scleral fixation of an IOL: finding the ciliary sulcus from outside',
    dur:579,
    short:'術前預習（右眼 OD，以 mm 建模的機轉切面＋術者視角）：23G TPPV、取出舊 IOL、MA60AC 用 10-0 Prolene 縫在睫狀溝。量尺零點抵哪條線、0.58／1／2 mm 垂直進針落在哪、實際下針 1 還是 2 mm、haptic 真的在溝裡的比例、為什麼避開 3、9 點；雙頭針穿線與胰島素空針接針、綁 haptic、置中、埋結；會出錯的地方與跟刀清單。',
    sum:'這支影片是一台右眼 OD 手術的術前預習：23G TPPV、經 12 點切口取出舊 IOL，再把三片式 MA60AC 用 10-0 Prolene 縫在睫狀溝，線結藏在三角形鞏膜瓣下。本例 IOL 往下脫位、玻璃體切除後縫回 12 點和 6 點，約一週後又半脫位。沒有囊袋支撐時可以放前房、固定在虹膜或鞏膜；鞏膜固定分縫線與不用縫線（例如 Yamane），AAO 兩次評估都沒有一種方法證明較好。合併 TPPV 的統合分析顯示視網膜剝離較少、IOL capture 較多，證據等級很低到低。全片四成多的時間花在從外面找到睫狀溝與穿線綁 haptic。角膜緣有兩條線：透明角膜邊緣，和後面灰藍帶的後緣（角膜緣後界）。屍眼研究從後界量，垂直穿過睫狀溝的入針點在後界後 0.83 mm（垂直經線）、0.46 mm（水平經線），2 點與 8 點模型內插成 0.58 mm（示意）。垂直往內，1 mm 在溝後緣、睫狀突前緣，2 mm 在睫狀突上；從透明角膜邊緣量，針會從隅角進到虹膜前面，垂直穿則打到虹膜根。實際下針比解剖位置後面：最接近本台的論文約 1 mm，一位作者後來一律 2 mm 以上，怕 haptic 磨虹膜、optic 卡到虹膜前；太後可能穿過睫狀突出血（引述 2.41 mm）。術後 UBM 看 haptic 真的在睫狀溝只有 15% 到 64%，從外面下針是盲做。3 點和 9 點有長睫狀動脈和神經，文獻常用 2 點與 8 點、相隔 180°，正對面拉才對稱。之後是量尺與 marking pen、結膜與邊長 3 mm、三分之一厚的三角形瓣、23G trocar（綜論寫角膜緣後 3.5 到 4 mm）、12 點切口與 viscoelastic。「10-0 直彎針」推測是雙頭針：直針從 2 點瓣床經虹膜後方，被 8 點瓣床的胰島素空針在瞳孔後面接住帶出，再從 12 點切口勾出、剪斷，各綁一支 haptic 的遠端三分之一（3-1-1 或 cow hitch）。放入 IOL 後兩邊張力一樣才置中；UBM 研究的垂直傾斜平均 3.13°，文中引述超過 5° 可能眩光或複視；縫在溝比囊袋內前面、術後偏近視。線結埋在瓣下才不會磨穿結膜。最後是會出錯的地方：偏位或脫位 8.9%、玻璃體出血 8.5%、線結外露、10-0 Prolene 晚期斷線、術中裂孔 7.3% 與術後視網膜剝離 5.1%；縫回後很快又脫位查不到專門研究，影片不推測本例的原因。片尾是跟刀清單。',
    note:'畫面都是以 mm 建模的動畫，沒有手術錄影。左邊是經 2 點與 8 點的機轉切面，右邊是術者視角：右眼 OD、術者坐 12 點，畫面下方是 12 點、右邊是 9 點 temporal，所以 2 點在左下、8 點在右上。手術步驟依主治醫師的術式範本，範本沒寫的細節照最接近的論文（Guedes 2026）示範，旁白都註明以主治為準：下針距離、固定的鐘點、瓣的大小、trocar 位置、舊 IOL 的取法、誰拿哪支針、綁法、8 點那頭怎麼固定、IOL 度數與圓刀的用途。排程單的「10-0 直彎針」推測是一條兩頭各一支針（一直一彎）的 10-0 Prolene，是推論。角膜緣後界放在透明角膜邊緣後 0.85 mm、2 點與 8 點的 0.58 mm、穿針的角度與會合點、trocar 的鐘點、取出舊 IOL 與放入 IOL 的路線都是示意，畫面上有標。本例病程只寫相對時間，早期再脫位的原因影片不推測。',

    id:'cataract-4-pcr', type:'youtube', yt:'gaLjjfhpbmU', cat:'surgery',

    dur:683,
    short:'白內障系列第四支，真實手術錄影（左眼 OS）＋同步的機轉切面：PCR 最常發生在哪一步、四組線索（前房突然變深與瞳孔變大、核塊不跟 tip 且一端歪、清亮的紅光、玻璃體跑到前面；正常 vs PCR 動畫示意）、第一步（phaco 留著、side port 打 dispersive OVD、穩了再退）、剩下的核、雙手前段玻璃體切除與 triamcinolone、IOL 放哪裡、術後追蹤與轉 VR，以及 wet lab 練習清單。',
    sum:'這支影片是白內障手術系列的第四支，四成的時間花在兩件事：認出後囊破了，和當下的第一個動作。後囊中央只有約 3.5 µm，後面緊貼著玻璃體；綜論指出 PCR 約六成發生在乳化核、約四分之一在 I/A，最常在吃最後一塊核時。早認出是為了不讓破口變大、核掉進玻璃體腔、玻璃體跑到前面。四組線索：前房突然變深、瞳孔一下子變大；核塊不跟 tip、轉不動、一端歪下去；red reflex 出現特別清亮的區域（I/A 吸到後囊時是匯向吸口的皺褶、紅光更亮、瞳孔拉尖）；玻璃體被前後的壓力差推進前房，本身透明，看到的是核塊跑不動。紅光弱的眼睛要靠前房深度與核塊的動作。第一步：不要突然抽出器械，停止乳化、phaco 留在原位，從 side port 打高分子量或 dispersive OVD 蓋住破口、把玻璃體擋在後面，前房穩了再慢慢退出；掉下去的核塊不要追。直接退出會讓前房變淺、玻璃體被推到切口、破口變大。I/A 時破了也一樣先打大量 OVD 再退。之後評估破口大小、剩下的核與皮質、玻璃體有沒有出來。前房裡的核塊用 dispersive OVD 墊著、鈍器械墊在下面、低能量乳化，太大的擴大切口改 ECCE 或 SICS；已掉進玻璃體腔的不撈，前段處理乾淨後交給 VR。剩下的皮質降低瓶高吸或用 vitrector 低切速吸；跑到前房的玻璃體用 vitrector 切，雙手（灌流與切割分開）比較好控制，也可以經 pars plana（角膜緣後 3.5–4 mm），triamcinolone 讓玻璃體看得見。IOL 依囊袋的支撐決定：in the bag、前囊完整時 3-piece 放 sulcus 或 optic capture、支撐不夠用其他固定；one-piece 壓克力放 sulcus 的文獻與 sulcus 度數要減 1.00 D。最後是收尾、術後追蹤（CME、RD、眼內炎、眼壓）與核碎片轉 VR 的時機，以及上刀前在 wet lab 要練的四件事。',
    note:'左邊是一台左眼 OS、術者坐 superior（12 點）的真實手術錄影，已去識別（只裁出眼睛範圍、畫面上沒有文字、不用聲音）；左眼的畫面右邊是 9 點 nasal，主切口約 11 點、side port 約 2 點。右邊是以 mm 建模的機轉切面或術者視角，和錄影同步，示意的部分畫面上有標。本例 red reflex 很弱，錄影看不出後囊確切在什麼時候破（術者推測在刻槽或移除核塊時），經典線索用動畫示意教。本例的做法只描述、不評斷：器械先退出、約 10 秒後經 side port 補 OVD（綜論建議 tip 留著、先打 OVD 再退）；白色顆粒看起來是 triamcinolone（術者推測）；IOL 依術者說明是 AAB00（one-piece 壓克力）放在 sulcus，錄影上看不出最後的位置。破口、玻璃體與核塊的形狀和量是示意；前段玻璃體切除的機器設定沒有講數字，依院內機器設定。',

    dur:535,
    short:'白內障系列第三支，真實手術錄影＋同步的機轉切面：I/A 吸口朝上、在前囊邊緣下夾住皮質拉到中央再吸、主切口下方的皮質（雙手 I/A、hydro-dispersion、本例的彎頭 tip）、吸到後囊的放射狀皺褶與第一步、OVD 撐開囊袋、one-piece IOL 進囊袋的順序、置中與 CCC 一圈蓋住 optic、IOL 前後的 OVD 都要清、切口密閉（stromal hydration 與 swab pressing），以及 wet lab 練習清單。',
    sum:'這支影片是白內障手術系列的第三支，三分之一以上的時間花在 I/A 和主切口下方的皮質。每一步先看做完的樣子，再看手術錄影與同步的機轉切面，最後看出錯的線索與當下的第一步。核拿掉之後，囊袋裡還剩一層皮質，貼在前囊邊緣下、赤道和周邊的後囊上；I/A 的目標是把皮質吸乾淨、後囊保持完整。I/A 的吸口開在 tip 的側面，任何時候都要知道它朝哪裡；常用的做法是吸口朝上、朝著角膜，看得到吸口、也離後囊最遠。腳踏 1 段只灌流、2 段才吸：tip 伸到前囊邊緣下夾住皮質，往中央拉、剝下來，到中央離後囊遠的地方再吸進去，一區接一區繞一圈；吸過的地方紅光變得均勻。主切口下方的皮質最難吸：直的 tip 從主切口進來往中央是往上斜，伸不到那裡的邊緣下，要換一個角度，例如雙手 I/A（吸的那支走側切口）或 hydro-dispersion（27G 鈍針經側切口對著主切口下方打 BSS 沖鬆再吸）；本例用的是彎頭的 tip 轉向側邊。吸到後囊時，後囊會出現一條條放射狀的皺褶、指向吸口；第一步是腳退回 1 段停止吸，機器有 reflux 就 reflux，不要把 tip 往上拉。放 IOL 之前先用 OVD 撐開囊袋；IOL 摺在 injector 裡從主切口打進去，前導 haptic 先進囊袋，optic 在囊袋裡打開，後 haptic 最後用 hook 從側切口壓進去。目標是 IOL 在囊袋裡置中、CCC 的邊緣一圈都蓋在 optic 上；專為囊袋設計的 one-piece IOL 不要留在 sulcus。IOL 放好之後，連 IOL 後面的 OVD 都要吸乾淨，囊袋才會貼回 IOL。最後是切口密閉：器械一退出前房最容易變淺，可以在切口兩側的基質打水（stromal hydration），或用棉棒壓住切口（swab pressing）；收尾前確認前房深度回來、切口不漏水。片尾是上刀前在 wet lab 要練的四件事。',
    note:'左邊是右眼 OD、術者坐 superior（12 點）的真實手術錄影，已去識別（只裁出眼睛範圍、畫面上沒有文字、不用聲音）；右邊是以 mm 建模的機轉切面或術者視角，和錄影同步，示意的部分畫面上有標。本例 zonule 弱：放 IOL 前另放了 CTR、最後縫合了主切口，routine 不需要，這兩段略過；IOL 打進去之後約 1 分半的調整看不清楚，也略過。本例從頭到尾用同一支彎頭 coaxial I/A tip、經主切口吸；剛性的彎頭伸不到主切口正下方，那一區在模型上是示意。I/A 退出後用棉棒壓住主切口那一側，沒有看到 stromal hydration。吸口方向、後囊皺褶、injector 斜面朝下與 IOL 轉正置中的做法是模型示意；IOL 型號、I/A tip、收尾用哪一種方法依院內常規。',

    dur:601,
    short:'白內障系列第二支，真實手術錄影＋同步的機轉切面＋腳踏與流體面板：hydrodissection（撕囊邊緣下、慢而連續、壓中央、確認轉得動；capsular block）、腳踏 0–3 段、刻槽（槽底 red reflex 變亮＝剩的核變薄）、兩支器械在槽底分核、核塊拉到中央再乳化（occlusion 與 surge）、surge／wound burn／zonule 弱的第一步，以及 wet lab 練習清單。',
    sum:'這支影片是白內障手術系列的第二支，一半以上的時間花在刻槽、分核和移除核塊。每一步先看做完的樣子，再看手術錄影與同步的機轉切面，最後看出錯的線索與當下的第一步。Hydrodissection 的目標是讓整顆核在囊袋裡鬆開、轉得動：cannula 尖端放在撕囊邊緣下，慢而連續地打 BSS，液體走在前囊與皮質之間、繞過赤道、從後囊前面越過去；每打一處就輕壓核的中央排出液體，最後推核確認轉得動。打太多、液體排不出去時核頂住撕囊口，就是術中的 capsular block（前房變淺、眼球變硬，像 expulsive hemorrhage），第一步是停止打水、壓中央排液。接著是 phaco 腳踏 0 到 3 段（1 段灌流、2 段加抽吸、3 段再加超音波）與機器面板。Divide and conquer 先從切口下方往對側刻一道槽，長到撕囊邊緣內、深到只剩薄的後板；槽越深，槽底的 red reflex 越亮。分核時兩支器械放到槽底往兩側推，裂縫要貫穿後板、裂到周邊才算分開，再轉 90° 刻第二道槽、再分一次。移除核塊時先 occlude 吸住，把核塊拉到中央、離後囊遠的地方再乳化；堵塞解除的那一刻會有 post-occlusion surge。最後是 surge（腳退回 1 段）、wound burn（放開 3 段、先確定有水流）與 zonule 弱（hydrodissection 做足、低流量、慢動作）的線索和第一步，以及上刀前在 wet lab 要練的四件事。',
    note:'左邊是右眼 OD、術者坐 superior（12 點）的真實手術錄影，已去識別（只裁出眼睛範圍、畫面上沒有文字、不用聲音）；右邊是以 mm 建模的機轉切面，和錄影同步，示意的部分畫面上有標。本例 zonule 弱（後來放了 CTR）；hydrodissection 從主切口進 3 次，錄影上看得到金色的環（hydrodelineation 的徵象），看不出壓中央與轉核；前半是刻槽＋分核，之後第二道槽看不清楚，標準的步驟用模型示範。腳踏與機器面板以 Veritas 為例，面板的數字是示意，依院內機器設定；刻槽的寬度、深度與槽底亮度沒有文獻數字，畫面標示意。',

    short:'白內障系列第一支，真實手術錄影＋同步的機轉切面：side port 與 OVD、keratome 三平面主切口（長≈寬）、CCC 的目標（5.0–5.5 mm、360° 蓋住 optic）與力學、一台撕囊逐段看、run-out 與 zonule 弱的線索和第一步，以及 wet lab 練習清單。',
    sum:'這支影片是白內障手術系列的第一支，一半以上的時間花在 CCC。每一步先看做完的樣子，再看手術錄影與同步的機轉切面，最後看出錯的線索與當下的第一步。Side port 開在左手那側（右眼、術者坐 12 點時是 nasal），經 side port 打 OVD 撐滿前房、保護內皮、壓平前囊；前房不夠深時，後方壓力把水晶體往前推，撕囊就多一個往外的力。主切口用 keratome 做三平面隧道，屍眼研究裡，長度接近寬度的方形切口比長方形切口耐壓得多；太短會漏、虹膜往切口跑，太長器械卡住、角膜起皺；superior 長隧道的 SIA 較大，長度怎麼取捨依院內常規。CCC 的目標是連續、圓、置中、約 5.0–5.5 mm、一圈蓋在 IOL optic 邊緣上；前緣的走向看拉力的方向，要夾在瓣上、靠近撕開的前緣，每撕一小段就重新夾。接著逐段看一台 zonule 弱的撕囊：夾住前囊時整片放射狀起皺、四段撕囊中重新夾與補 OVD 的節奏。最後是 run-out（前緣偏離圓、跑到虹膜下）的第一步：停、補 OVD 壓平、把瓣往反方向拉再往中央（Little 法），以及 zonule 弱時放慢、減小拉力、撕囊時囊袋不穩是放 CTR 的時機之一，和上刀前在 wet lab 要練的四件事。',
    note:'左邊是右眼 OD、術者坐 superior（12 點）的真實手術錄影，已去識別（只裁出眼睛範圍、畫面上沒有文字、不用聲音）；右邊是以 mm 建模的機轉切面，和錄影同步，示意的部分畫面上有標。本例 zonule 弱（後來放了 CTR）、主切口在 12 點偏 temporal 約 22°（11 點多）、撕囊由撕囊鉗直接夾住前囊中央起頭，沒有先用 cystotome；routine 的樣子用模型示範。切口寬度、IOL optic 大小等各院做法不同的地方，依院內常規。',

    sum:'這支影片用一條右眼 10 點的角鞏膜裂傷（從角膜跨過角膜緣，停在角膜緣後 4 mm，角膜緣處虹膜脫出）示範 zone I 到 zone II 的修補。先用經傷口的子午切面說明 zone 的分法、zone II 底下是睫狀體、直肌附著在它後面；顯微鏡下看 peaked pupil、脫出的虹膜與蓋住鞏膜段的結膜下出血，整個過程不壓眼球。接著是器械與雙手：持針器像握筆一樣拿、手靠穩、夾針身稍靠針尾、垂直進出針，左手有齒鑷夾邊緣，角度不順就反手或換手。然後從傷口對側的 paracentesis 打 OVD、用 cyclodialysis spatula 回納虹膜；第一針用 9-0 nylon 對齊角膜緣；角膜用 10-0 nylon，深度 70–90%、垂直對稱、周邊長而淺中央短而深、避開視軸，打結後剪短埋進針道；最後 360° 剪開結膜探查、鞏膜由前往後以 8-0 nylon 縫合，重建前房、確認不漏水、結膜蓋回。',

/* ---------- app ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = t => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');
const catName = id => (CATS.find(c => c.id === id) || {zh:''}).zh;
const nChapters = v => v.chapters ? v.chapters.reduce((n, g) => n + g.items.length, 0) : 0;
const posterOf = v => v.poster || (v.type === 'youtube' && v.yt ? `https://i.ytimg.com/vi/${encodeURIComponent(v.yt)}/hqdefault.jpg` : '');
const PLAY = '<svg class="play" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="21" fill="var(--surface)" opacity=".92"/><path d="M18 14.5L30.5 22L18 29.5Z" fill="var(--accent)"/></svg>';
const YT_HOST = 'https://www.youtube-nocookie.com';
let cat = 'all', cleanup = null, renderToken = 0, ytApi = null;

/* YouTube IFrame API：第一次打開 YouTube 影片時才載入；載入失敗就退回一般嵌入 */
function loadYT(){
  if (!ytApi) ytApi = new Promise((resolve, reject) => {
    if (window.YT && window.YT.Player) return resolve(window.YT);
    let done = false;
    window.onYouTubeIframeAPIReady = () => { done = true; resolve(window.YT); };
    const fail = () => { if (!done) { done = true; ytApi = null; reject(new Error('YouTube API unavailable')); } };
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    s.onerror = fail;
    document.head.appendChild(s);
    setTimeout(fail, 10000);
  });
  return ytApi;
}

function renderChips(){
  const all = [{id:'all', zh:'全部'}, ...CATS];
  $('#chips').innerHTML = all.map(c => {
    const n = c.id === 'all' ? VIDEOS.length : VIDEOS.filter(v => v.cat === c.id).length;
    return `<button type="button" class="chip" data-cat="${c.id}" aria-pressed="${c.id === cat}">${esc(c.zh)}<span class="n">${n}</span></button>`;
  }).join('');
}

function renderList(){
  renderChips();
  const list = VIDEOS.filter(v => cat === 'all' || v.cat === cat);
  $('#vlist').innerHTML = list.map(v => {
    const tags = [...(v.tags || [])];
    if (nChapters(v)) tags.push(nChapters(v) + ' 個章節');
    if (v.refs && v.refs.length) tags.push(v.refs.length + ' 篇文獻');
    return `<li><a class="vcard" href="#${encodeURIComponent(v.id)}">
      <div class="poster">${posterOf(v) ? `<img src="${esc(posterOf(v))}" alt="" loading="lazy">` : ''}${PLAY}${v.dur ? `<span class="dur">${fmt(v.dur)}</span>` : ''}</div>
      <div>
        <div class="cat">${esc(catName(v.cat))}</div>
        <h2>${esc(v.zh)}<span class="en">${esc(v.en)}</span></h2>
        <p>${esc(v.short)}</p>
        <div class="tags">${tags.map(t => `<span>${esc(t)}</span>`).join('')}</div>
      </div>
    </a></li>`;
  }).join('');
  $('#empty').hidden = list.length > 0;
}

function renderDetail(v){
  $('#d-title').innerHTML = `${esc(v.zh)}<span class="en">${esc(v.en)}</span>`;
  const meta = [catName(v.cat)];
  if (v.dur) meta.push('片長 ' + fmt(v.dur));
  if (nChapters(v)) meta.push(nChapters(v) + ' 個章節');
  if (v.refs && v.refs.length) meta.push(v.refs.length + ' 篇參考文獻');
  $('#d-meta').innerHTML = meta.map(m => `<span>${esc(m)}</span>`).join('');

  /* 播放器：seek(t) 跳到第 t 秒，now() 回傳目前秒數（取不到時回傳 null） */
  const screen = $('#d-screen');
  const token = ++renderToken;
  let seek = null, now = () => null, player = null, plainYT = false, timer = null;
  if (v.type === 'youtube') {
    const embed = start => `${YT_HOST}/embed/${encodeURIComponent(v.yt)}?rel=0&playsinline=1${start != null ? `&start=${start}&autoplay=1` : ''}`;
    const plain = start => {
      plainYT = true;
      screen.querySelector('.yt').innerHTML = `<iframe src="${esc(embed(start))}" title="${esc(v.zh)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
    };
    screen.innerHTML = '<div class="yt"><div id="yt-player"></div></div>';
    loadYT().then(YT => {
      if (token !== renderToken) return;
      player = new YT.Player('yt-player', {host: YT_HOST, videoId: v.yt, width: '100%', height: '100%', playerVars: {rel: 0, playsinline: 1}});
    }).catch(() => { if (token === renderToken) plain(); });
    const ready = () => !plainYT && player && typeof player.seekTo === 'function';
    seek = t => { if (ready()) { player.seekTo(t, true); player.playVideo(); } else plain(t); };
    now = () => ready() ? player.getCurrentTime() : null;
  } else if (v.type === 'anim') {
    screen.innerHTML = `<iframe src="${esc(v.src)}" title="${esc(v.zh)}" loading="lazy"></iframe>`;
  } else {
    screen.innerHTML = `<video controls preload="metadata" playsinline ${v.poster ? `poster="${esc(v.poster)}"` : ''} src="${esc(v.src)}"></video>`;
    const video = screen.querySelector('video');
    seek = t => { video.currentTime = t; video.play().catch(() => {}); };
    now = () => video.currentTime;
  }
  $('#d-sum').textContent = v.sum || v.short;
  $('#d-note').hidden = !v.note;
  $('#d-note').textContent = v.note || '';

  const hasCh = !!(v.chapters && v.chapters.length);
  $('#d-ch-h').hidden = $('#d-chapters').hidden = !hasCh;
  $('#d-chapters').innerHTML = hasCh ? v.chapters.map(g => `<li class="grp">
      ${g.g ? `<div class="grp-h">${esc(g.g)}</div>` : ''}
      <ol>${g.items.map(([t, label]) => `<li><button type="button" class="ch" data-t="${t}" ${seek ? '' : 'disabled'}><span class="ts">${fmt(t)}</span><span>${esc(label)}</span></button></li>`).join('')}</ol>
    </li>`).join('') : '';

  const refs = v.refs || [];
  $('#d-refs-box').hidden = !refs.length;
  $('#d-refs-sum').textContent = `參考文獻（${refs.length} 篇）`;
  $('#d-refs').innerHTML = refs.map(r => {
    const href = r.doi ? 'https://doi.org/' + r.doi : r.url;
    const label = r.doi ? 'doi:' + r.doi : '連結';
    return `<li>${esc(r.c)} <a href="${esc(href)}" target="_blank" rel="noopener">${esc(label)}</a></li>`;
  }).join('');

  if (seek && hasCh) {
    const btns = [...document.querySelectorAll('#d-chapters .ch')];
    const times = btns.map(b => +b.dataset.t);
    const mark = cur => {
      if (cur == null) return;
      let i = -1;
      times.forEach((t, k) => { if (cur + 0.3 >= t) i = k; });
      btns.forEach((b, k) => b.setAttribute('aria-current', k === i ? 'true' : 'false'));
    };
    btns.forEach(b => b.addEventListener('click', () => { seek(+b.dataset.t); mark(+b.dataset.t); }));
    const video = screen.querySelector('video');
    if (video) ['timeupdate', 'seeked'].forEach(e => video.addEventListener(e, () => mark(now())));
    else timer = setInterval(() => mark(now()), 500);
  }
  cleanup = () => {
    clearInterval(timer);
    const video = screen.querySelector('video');
    if (video) video.pause();
    if (player && typeof player.destroy === 'function') player.destroy();
    screen.innerHTML = '';
  };
  document.title = `${v.zh} · 教學影片 · ophlearning`;
}

function route(){
  if (cleanup) { cleanup(); cleanup = null; }
  renderToken++;
  const id = decodeURIComponent(location.hash.slice(1));
  // retired ids keep working: the old one-video cataract page now opens the first video of the 4-part series
  const ALIAS = { cataract: 'cataract-1-wound-ccc' };
  if (ALIAS[id]) { location.replace('#' + ALIAS[id]); return; }
  const v = VIDEOS.find(x => x.id === id);
  $('#list-view').hidden = !!v;
  $('#detail-view').hidden = !v;
  if (v) renderDetail(v);
  else { document.title = '教學影片 · ophlearning'; renderList(); }
  window.scrollTo(0, 0);
}

$('#chips').addEventListener('click', e => {
  const b = e.target.closest('.chip');
  if (!b) return;
  cat = b.dataset.cat;
  renderList();
});
addEventListener('hashchange', route);
route();
</script>
</body>
</html>
